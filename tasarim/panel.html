<title>Mailhanem Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* Tek tema: panel her koşulda beyaz kalır, izleyicinin koyu moduna uymaz. */
  --zemin:#FFFFFF; --yuzey:#FFFFFF; --yuzey2:#F4F6F9;
  --cizgi:#E6EAEF; --cizgi2:#D4DAE2;
  --metin:#16202B; --metin2:#485664;
  --soluk:#64717F;
  --murekkep:#1D4E7C; --mrk-yum:#EAF0F6; --mrk-metin:#1A4570;
  --ana-zemin:#1D4E7C; --ana-metin:#FFFFFF;
  --olumlu:#0F7154; --olm-yum:#E3F2EC;
  --uyari:#8A5A07;  --uyr-yum:#FBF1DF;
  --kritik:#B23A40; --krt-yum:#FBE9EA;
  --bilgi:#26734F;  --blg-yum:#E5F0EA;
  --kat-satis:#1D4E7C; --kat-destek:#2F8F63; --kat-fatura:#B5820A;
  --kat-sikayet:#BE2F4A; --kat-bulten:#6E8092;
  --av-1:#1D4E7C; --av-2:#26734F; --av-3:#8F5C0D; --av-4:#A32F35; --av-5:#5E6B78;
  --golge:0 1px 2px rgba(20,30,45,.04), 0 4px 14px -6px rgba(20,30,45,.10);
  --golge-yuk:0 2px 4px rgba(20,30,45,.05), 0 12px 28px -10px rgba(20,30,45,.16);
  --r:11px; --r2:8px;
  --ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
}
/* ── tarayıcı yüzeyleri: seçim, imleç, kaydırma çubuğu ── */
::selection{background:var(--mrk-yum);color:var(--mrk-metin)}
html{scrollbar-color:var(--cizgi2) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--cizgi2);border-radius:6px;
  border:3px solid var(--yuzey);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--soluk);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
input,textarea,select{caret-color:var(--murekkep)}
input::placeholder,textarea::placeholder{color:var(--soluk)}
.ikn{flex:none;display:block}

/* tek yetkili hareket: içerik değişince görünür durumdan yerine oturur */
@keyframes yerlesir{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}
*{box-sizing:border-box}
body{background:var(--yuzey);color-scheme:light;color:var(--metin);font-family:var(--ui);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--murekkep);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3,p,dl,dd,ul{margin:0}

.uygulama{height:100dvh;min-height:640px;display:grid;grid-template-columns:246px 1fr}

/* ── beyaz sol menü ────────────────────────── */
.yannav{background:var(--yuzey);border-right:1px solid var(--cizgi);
  display:flex;flex-direction:column;padding:20px 14px 14px;overflow-y:auto}
.nav-marka{display:flex;align-items:center;gap:11px;padding:0 8px;margin-bottom:22px;flex:none}
.nav-marka .amblem{width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(140deg,#2E6FA8,#18566B);display:grid;place-items:center;
  color:#fff;font-size:17px;box-shadow:0 3px 8px -2px rgba(29,78,124,.5)}
.nav-marka b{font-size:16px;font-weight:700;letter-spacing:-.028em;display:block}
.nav-marka small{color:var(--soluk);font-size:11.5px}
.nav-oge{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 11px;border:0;background:none;border-radius:var(--r2);cursor:pointer;
  color:var(--metin2);font-size:14px;font-weight:500;letter-spacing:-.01em;
  margin-bottom:2px;transition:background .12s,color .12s}
.nav-oge:hover{background:var(--yuzey2);color:var(--metin)}
.nav-oge.aktif{background:var(--mrk-yum);color:var(--mrk-metin);font-weight:600}
.nav-oge .ikon{width:17px;text-align:center;font-size:14px;flex:none;opacity:.85}
.nav-oge.aktif .ikon{opacity:1}
.nav-oge .et{flex:1}
.nav-oge .sayi{font-family:var(--mono);font-size:11px;font-weight:600;
  background:var(--yuzey2);color:var(--soluk);padding:1px 7px;border-radius:9px}
.nav-oge.aktif .sayi{background:#fff;color:var(--mrk-metin)}
.nav-oge .sayi.dikkat{background:var(--krt-yum);color:var(--kritik)}
.nav-alt{margin-top:auto;padding:12px 11px 0;border-top:1px solid var(--cizgi);
  display:flex;align-items:center;gap:10px;flex:none}
.nav-alt .kim{min-width:0;flex:1}
.nav-alt b{display:block;font-size:13px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-alt small{color:var(--soluk);font-size:11.5px}

.av{border-radius:50%;display:grid;place-items:center;color:#fff;
  font-weight:700;letter-spacing:.02em;flex:none;width:18px;height:18px;font-size:9px}
.av.orta{width:30px;height:30px;font-size:11.5px}
.av.kare{border-radius:9px;width:38px;height:38px;font-size:14px}

/* ── içerik ────────────────────────────────── */
.icerik{overflow:hidden;display:grid;grid-template-rows:1fr;min-width:0;background:var(--yuzey)}
.sahne{overflow-y:auto;min-height:0}
.sayfa{padding:26px 30px 46px;max-width:1240px;animation:yerlesir .22s cubic-bezier(.16,1,.3,1)}
.sayfa-ust{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.sayfa-ust h1{font-size:24px;font-weight:700;letter-spacing:-.035em;line-height:1.2}
.sayfa-ust p{color:var(--soluk);font-size:13.5px;margin-top:3px}
.ornek{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--uyari);background:var(--uyr-yum);padding:4px 8px;border-radius:5px;flex:none}
.zaman-sec{margin-left:auto;display:flex;gap:3px;background:var(--yuzey);
  border:1px solid var(--cizgi);border-radius:var(--r2);padding:3px;flex:none}
.zaman-sec button{padding:5px 11px;border:0;background:none;border-radius:5px;
  font-size:12.5px;font-weight:600;color:var(--soluk);cursor:pointer}
.zaman-sec button.aktif{background:var(--mrk-yum);color:var(--mrk-metin)}

/* istatistik kartları */
.kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));
  gap:14px;margin-bottom:18px}
.skart{display:flex;align-items:center;gap:13px;padding:16px 17px;background:var(--yuzey);
  border:1px solid var(--cizgi);border-radius:var(--r);
  text-align:left;cursor:pointer;transition:background .13s,border-color .13s}
.skart:hover{background:var(--yuzey2);border-color:var(--cizgi2)}
.simge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-size:16px;flex:none}
.s-bekle{background:var(--uyr-yum);color:var(--uyari)}
.s-gonder{background:var(--olm-yum);color:var(--olumlu)}
.s-red{background:var(--krt-yum);color:var(--kritik)}
.s-toplam{background:var(--mrk-yum);color:var(--mrk-metin)}
.skart b{display:block;font-size:25px;font-weight:700;letter-spacing:-.04em;
  line-height:1.1;font-variant-numeric:tabular-nums}
.skart span{font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--soluk)}

/* paneller */
.izgara{display:grid;gap:14px;margin-bottom:18px}
.iki{grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr)}
@media (max-width:1080px){.iki{grid-template-columns:1fr}}
.kutu{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r);
  display:flex;flex-direction:column;
  min-width:0}
.kutu-ust{display:flex;align-items:center;gap:8px;padding:15px 18px 0}
.kutu-ad{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--soluk)}
.kutu-ust .im{color:var(--soluk);font-size:13px}
.kutu-not{margin-left:auto;font-size:11.5px;color:var(--soluk)}
.kutu-ic{padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center}

/* onay durumu — halka */
.halka-alan{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.halka{flex:none;position:relative;width:146px;height:146px}
.halka svg{transform:rotate(-90deg)}
.halka-orta{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.halka-orta b{display:block;font-size:26px;font-weight:700;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1}
.halka-orta small{display:block;margin-top:2px;color:var(--soluk);font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase}
.aciklama{display:flex;flex-direction:column;gap:11px;min-width:0}
.acik-satir{display:flex;align-items:center;gap:9px;font-size:13.5px}
.acik-satir .nokta{width:9px;height:9px;border-radius:50%;flex:none}
.acik-satir .ad{flex:1}
.acik-satir .deg{font-family:var(--mono);font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums}

/* kategori dağılımı */
.dagilim{display:flex;flex-direction:column;gap:15px}
.dag-ust{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.dag-ad{font-size:13.5px;font-weight:500;letter-spacing:-.008em}
.dag-say{font-family:var(--mono);font-size:11.5px;color:var(--soluk)}
.dag-yuzde{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:600;
  color:var(--soluk);font-variant-numeric:tabular-nums}
.ray{height:7px;background:var(--yuzey2);border-radius:4px;overflow:hidden}
.ray i{display:block;height:100%;border-radius:4px}

/* onay bekleyen liste — kart satırlar */
.satirlar{display:flex;flex-direction:column;gap:9px}
.msatir{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:13px 16px;background:var(--yuzey);border:1px solid var(--cizgi);
  border-radius:var(--r);cursor:pointer;
  transition:background .13s,border-color .13s}
.msatir:hover{background:var(--yuzey2);border-color:var(--cizgi2)}
.msatir.vurgu{background:var(--uyr-yum);border-color:#EBD9B4}
.msatir .orta{flex:1;min-width:0}
.msatir .bas{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.msatir .konu{font-size:14.5px;font-weight:600;letter-spacing:-.018em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msatir .yildiz{color:var(--uyari);font-size:13px;flex:none}
.msatir .alt{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soluk)}
.pill{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:14px;flex:none}
.p-bekle{background:var(--uyr-yum);color:var(--uyari)}
.p-gonder{background:var(--olm-yum);color:var(--olumlu)}
.p-red{background:var(--krt-yum);color:var(--kritik)}
.cip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.k-satis{background:var(--mrk-yum);color:var(--mrk-metin)}
.k-destek{background:var(--blg-yum);color:var(--bilgi)}
.k-fatura{background:var(--uyr-yum);color:var(--uyari)}
.k-sikayet{background:var(--krt-yum);color:var(--kritik)}
.k-bulten{background:var(--yuzey2);color:var(--soluk)}
.k-olumlu{background:var(--olm-yum);color:var(--olumlu)}
.vip{background:var(--metin);color:var(--yuzey)}
.bolum-ad{font-size:15px;font-weight:700;letter-spacing:-.024em;margin-bottom:11px;
  display:flex;align-items:center;gap:9px}
.bolum-ad .sayi{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--soluk);
  background:var(--yuzey2);padding:2px 8px;border-radius:9px}

/* ── gelen kutusu (iki panel) ──────────────── */
.kutu-govde{display:grid;grid-template-columns:minmax(316px,392px) minmax(0,1fr);
  height:100%;overflow:hidden}
.sutun{overflow-y:auto;background:var(--yuzey);border-right:1px solid var(--cizgi)}
.sutun:last-child{border-right:0;background:var(--yuzey)}
.liste-ust{position:sticky;top:0;z-index:2;background:var(--yuzey);
  border-bottom:1px solid var(--cizgi);padding:11px 0 9px;
  display:flex;flex-direction:column;gap:7px}

/* kolonun çapası: nerede olduğunu söyleyen başlık */
.liste-baslik{display:flex;align-items:center;gap:7px;padding:0 16px}
.liste-baslik .ad{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.liste-baslik .hsec{margin:0;border:0;background:none;padding:3px 4px;
  font-size:12.5px;color:var(--metin2);font-weight:500;max-width:none}
.liste-baslik .hsec:hover{color:var(--metin)}
.liste-baslik .adet{margin-left:auto;font-family:var(--mono);font-size:11px;
  color:var(--soluk);font-variant-numeric:tabular-nums}

/* şeritler sarmaz, kaydırılır — sarma sıkışıklık hissinin kaynağıydı */
.serit-kaydir{display:flex;gap:5px;align-items:center;overflow-x:auto;
  padding:0 16px;scrollbar-width:none;-ms-overflow-style:none}
.serit-kaydir::-webkit-scrollbar{display:none}
.serit-kaydir > *{flex:none}
.suzgec{display:flex;gap:5px;align-items:center}
.sekme{padding:5px 10px;border:0;background:none;border-radius:6px;
  font-size:12.5px;font-weight:600;color:var(--soluk);cursor:pointer}
.sekme:hover{background:var(--yuzey2);color:var(--metin)}
.sekme.aktif{background:var(--mrk-yum);color:var(--mrk-metin)}
.hsec{margin-left:auto;padding:5px 8px;border:1px solid var(--cizgi);border-radius:6px;
  background:var(--yuzey2);font-size:12px;cursor:pointer}
.satir{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:0;
  border-bottom:1px solid var(--cizgi);background:none;padding:15px 16px 14px;cursor:pointer}
.satir:hover{background:var(--yuzey2)}
.satir.secili{background:var(--mrk-yum)}
.satir.secili .konu{color:var(--mrk-metin)}
.satir.okunmamis .konu{font-weight:700}
.satir .govde{flex:1;min-width:0}
/* okuma sırası: konu → gönderen/zaman → önizleme → durum */
.konu{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.022em;
  color:var(--metin);margin-bottom:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.satir.okunmamis .konu{font-weight:700}
.s1{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.kat-im{width:7px;height:7px;border-radius:2px;flex:none}
.gonderen{font-weight:500;letter-spacing:-.006em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12.5px;color:var(--metin2)}
.satir.okunmamis .gonderen{color:var(--metin);font-weight:600}
.zaman{font-family:var(--mono);font-size:11px;color:var(--soluk);flex:none}
.onizleme{display:block;font-size:12.5px;color:var(--soluk);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;margin-bottom:10px;line-height:1.45}
.s3{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:18px}
.rozet-sahip{display:inline-flex;align-items:center;gap:4px;font-size:11px;
  color:var(--soluk);margin-left:auto}
.sahipsiz{color:var(--uyari);font-weight:600}
.bekleme{font-family:var(--mono);font-size:11px;color:var(--soluk)}
.bekleme.uyr{color:var(--uyari);font-weight:600}
.bekleme.krt{color:var(--kritik);font-weight:600}
.ek{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);
  font-size:11px;color:var(--soluk)}

.detay{padding:22px 26px 46px;max-width:840px;animation:yerlesir .2s cubic-bezier(.16,1,.3,1)}
.d-ust{display:flex;align-items:flex-start;gap:12px;margin-bottom:5px}
.d-konu{font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1.26;
  text-wrap:balance;flex:1}
.d-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:10px 0 15px;border-bottom:1px solid var(--cizgi);margin-bottom:15px}
.d-adres{font-family:var(--mono);font-size:12px;color:var(--soluk)}
.kart{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r);
  margin-bottom:13px}
.kart-ust{display:flex;align-items:center;gap:8px;padding:12px 16px;
  border-bottom:1px solid var(--cizgi)}
.kart-ad{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--soluk)}
.govde-metin{padding:16px 17px;font-size:14px;line-height:1.65;color:var(--metin2);
  max-width:65ch;white-space:pre-line}
.govde-metin strong{color:var(--metin);font-weight:600}
.ai .kart-ust{background:var(--yuzey2);border-radius:var(--r) var(--r) 0 0}
.guven{margin-left:auto;display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:11px;color:var(--soluk)}
.cubuk{width:46px;height:4px;border-radius:2px;background:var(--cizgi);overflow:hidden}
.cubuk i{display:block;height:100%;background:var(--olumlu);border-radius:2px}
.ai-ic{padding:16px 17px}
.ozet{font-size:13.5px;color:var(--metin2);max-width:62ch}
.alanlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));
  gap:1px;background:var(--cizgi);border:1px solid var(--cizgi);
  border-radius:var(--r2);overflow:hidden;margin:14px 0}
.alanlar div{background:var(--yuzey);padding:9px 11px}
.alanlar dt{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--soluk);margin-bottom:1px}
.alanlar dd{font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:-.02em}
.taslak-et{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.taslak-et span{font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--soluk)}
textarea.taslak{width:100%;min-height:178px;padding:14px 15px;border:1px solid var(--cizgi2);
  border-radius:var(--r2);background:var(--yuzey2);resize:vertical;line-height:1.65;
  font-size:13.5px;color:var(--metin)}
textarea.taslak:focus{outline:2px solid var(--murekkep);outline-offset:-1px;
  border-color:transparent;background:var(--yuzey)}
.eylemler{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.dugme{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r2);
  border:1px solid var(--cizgi2);background:var(--yuzey);font-size:13px;font-weight:600;
  cursor:pointer;letter-spacing:-.01em;transition:background .12s,border-color .12s}
.dugme:hover{background:var(--yuzey2);border-color:var(--soluk)}
.dugme.ana{background:var(--ana-zemin);border-color:var(--ana-zemin);color:var(--ana-metin)}
.dugme.ana:hover{filter:brightness(1.12)}
.dugme.ufak{padding:5px 11px;font-size:12.5px}
.ipucu{margin-left:auto;font-size:11.5px;color:var(--soluk)}
kbd{font-family:var(--mono);font-size:11px;background:var(--yuzey2);
  border:1px solid var(--cizgi2);border-bottom-width:2px;border-radius:4px;
  padding:1px 4px;color:var(--metin2)}
.serit{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:var(--r);
  margin-bottom:13px;font-size:13px;font-weight:500}
.serit.uyr{background:var(--uyr-yum);color:var(--uyari)}
.serit.olm{background:var(--olm-yum);color:var(--olumlu)}
.serit .dugme{margin-left:auto}
.ekkart{display:flex;align-items:center;gap:11px;padding:12px 16px;
  border-top:1px solid var(--cizgi)}
.ekikon{width:31px;height:39px;border-radius:5px;background:var(--krt-yum);
  color:var(--kritik);display:grid;place-items:center;font-family:var(--mono);
  font-size:9px;font-weight:700;flex:none}
.ekad{font-family:var(--mono);font-size:12.5px;font-weight:500}
.ekozet{font-size:12.5px;color:var(--soluk);margin-top:1px}

/* ── süzgeç şeridi ─────────────────────────── */
.sekme i{font-family:var(--mono);font-style:normal;font-size:11px;opacity:.65;margin-left:4px}
.sekme.bos{opacity:.42}
.suz2{display:flex;gap:7px;align-items:center;padding:0 16px}
.suz2 .arama{position:relative;flex:1;min-width:0}
.suz2 .hsec{margin:0;flex:none;max-width:132px}
.suz2 .arama svg{position:absolute;left:9px;top:8px;color:var(--soluk)}
.suz2 .arama input{width:100%;padding:6px 10px 6px 27px;border:1px solid var(--cizgi);
  border-radius:6px;background:var(--yuzey2);font-size:12.5px}
.suz2 .hsec{margin:0;flex:none;max-width:118px}
.katsuz{display:flex;gap:5px}
.kcip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;cursor:pointer;
  border:1px solid var(--cizgi);background:var(--yuzey);border-radius:13px;
  font-size:12px;font-weight:600;color:var(--metin2);transition:background .12s,border-color .12s}
.kcip:hover{background:var(--yuzey2)}
.kcip i{width:7px;height:7px;border-radius:2px;flex:none}
.kcip b{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--soluk)}
.kcip.secili{border-color:var(--murekkep);background:var(--mrk-yum);color:var(--mrk-metin)}
.kcip.secili b{color:var(--mrk-metin)}
.kcip.bos{opacity:.4}
.kcip.temizle{color:var(--soluk);border-style:dashed}
.liste-bos{padding:40px 18px;text-align:center;color:var(--soluk);
  display:flex;flex-direction:column;align-items:center;gap:12px}

/* ── ekip notu ─────────────────────────────── */
.notkart{background:var(--uyr-yum);border-color:#EBD9B4}
.notkart .kart-ust{border-bottom-color:#EBD9B4}
.not-ic{padding:13px 16px}
.not-s{background:var(--yuzey);border-radius:var(--r2);padding:10px 12px;margin-bottom:8px;
  font-size:13px;color:var(--metin2)}
.not-b{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.not-b b{font-size:12px;font-weight:600;color:var(--metin)}
.not-b span{font-family:var(--mono);font-size:11px;color:var(--soluk);margin-left:auto}
.not-gir{display:flex;gap:8px;margin-top:4px}
.not-gir input{flex:1;min-width:0;padding:8px 11px;border:1px solid #E0CDA4;
  border-radius:var(--r2);font-size:13px;background:var(--yuzey)}

/* ── konuşma zinciri ───────────────────────── */
.zincir-ac{display:block;width:100%;text-align:left;border:1px dashed var(--cizgi2);
  background:none;border-radius:var(--r2);padding:9px 14px;margin-bottom:12px;
  font-size:12.5px;font-weight:600;color:var(--soluk);cursor:pointer}
.zincir-ac:hover{background:var(--yuzey2);color:var(--metin)}
.zincir{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.zmesaj{border:1px solid var(--cizgi);border-radius:var(--r2);padding:12px 14px;
  font-size:13px;color:var(--metin2);line-height:1.6;max-width:62ch}
.zmesaj.ben{background:var(--yuzey2);margin-left:26px}
.zust{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.zust b{font-size:12.5px;font-weight:600;color:var(--metin)}
.zust span{font-family:var(--mono);font-size:11px;color:var(--soluk);margin-left:auto}

.gecmis-rz{border:1px solid var(--cizgi);background:var(--yuzey2);border-radius:11px;
  padding:2px 9px;font-size:11px;font-weight:600;color:var(--metin2);cursor:pointer}
.gecmis-rz:hover{border-color:var(--murekkep);color:var(--mrk-metin)}

/* ── giriş ekranı ──────────────────────────── */
.giris{position:fixed;inset:0;background:var(--yuzey);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;padding:24px;z-index:50}
.giris-kart{width:min(392px,100%);border:1px solid var(--cizgi);border-radius:14px;padding:28px 26px}
.giris-marka{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.giris-marka .amblem{width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(140deg,#2E6FA8,#18566B);display:grid;place-items:center;
  color:#fff;font-size:17px}
.giris-marka b{display:block;font-size:16px;font-weight:700;letter-spacing:-.028em}
.giris-marka small{color:var(--soluk);font-size:11.5px}
.giris-kart h1{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
.giris-kart p{color:var(--metin2);font-size:13.5px;line-height:1.55;margin-bottom:18px}
.dugme.genis{width:100%;justify-content:center}
.giris-ayrac{display:flex;align-items:center;gap:11px;margin:16px 0;
  font-size:12px;color:var(--soluk)}
.giris-ayrac::before,.giris-ayrac::after{content:"";flex:1;height:1px;background:var(--cizgi)}
.giris-ok{width:44px;height:44px;border-radius:50%;background:var(--olm-yum);color:var(--olumlu);
  display:grid;place-items:center;font-size:20px;font-weight:700;margin-bottom:14px}
.giris-dip{font-size:12px;color:var(--soluk)}
.cikis{border:0;background:none;color:var(--soluk);font-size:15px;cursor:pointer;
  padding:4px 6px;border-radius:6px;flex:none}
.cikis:hover{background:var(--yuzey2);color:var(--kritik)}

.hbos{max-width:520px;margin:40px auto;text-align:center}
.hbos-ikon{width:56px;height:56px;border-radius:16px;background:var(--mrk-yum);color:var(--mrk-metin);
  display:grid;place-items:center;font-size:24px;margin:0 auto 18px}
.hbos h1{font-size:21px;font-weight:700;letter-spacing:-.03em;margin-bottom:8px}
.hbos p{color:var(--metin2);font-size:13.5px;line-height:1.6;margin-bottom:20px}
.hbos-adim{display:flex;flex-direction:column;gap:11px;margin-top:26px;text-align:left}
.hbos-adim div{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;
  border:1px solid var(--cizgi);border-radius:var(--r)}
.hbos-adim b{width:24px;height:24px;border-radius:50%;background:var(--yuzey2);color:var(--soluk);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.hbos-adim span{font-size:12.5px;color:var(--soluk);line-height:1.5}
.hbos-adim strong{display:block;font-size:13.5px;font-weight:600;color:var(--metin);
  letter-spacing:-.014em;margin-bottom:1px}

/* taslak ekranlar */
/* ── mail hesapları ────────────────────────── */
.uyari-serit{display:flex;align-items:center;gap:11px;padding:13px 16px;
  background:var(--krt-yum);border:1px solid #F0CFD1;border-radius:var(--r);
  margin-bottom:18px;font-size:13.5px}
.uyari-serit .im{font-size:16px;color:var(--kritik);flex:none}
.uyari-serit b{color:var(--kritik)}
.uyari-serit .dugme{margin-left:auto;flex:none}

.h-kart{border:1px solid var(--cizgi);border-radius:var(--r);margin-bottom:12px;
  background:var(--yuzey)}
.h-kart.kopuk{border-color:#EBC6C8}
.h-ust{display:flex;align-items:center;gap:12px;padding:15px 17px}
.h-ikon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  font-size:16px;flex:none;background:var(--mrk-yum);color:var(--mrk-metin)}
.h-kart.kopuk .h-ikon{background:var(--krt-yum);color:var(--kritik)}
.h-bilgi{flex:1;min-width:0}
.h-adres{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:-.03em;
  display:block;overflow:hidden;text-overflow:ellipsis}
.h-alt{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--soluk);
  margin-top:2px;flex-wrap:wrap}
.h-durum{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:4px 10px;border-radius:13px;flex:none}
.h-durum.iyi{background:var(--olm-yum);color:var(--olumlu)}
.h-durum.kotu{background:var(--krt-yum);color:var(--kritik)}
.h-durum i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.h-eylem{display:flex;gap:7px;flex:none}
.h-hata{padding:0 17px 15px;display:flex;align-items:flex-start;gap:11px}
.h-hata-ic{background:var(--krt-yum);border-radius:var(--r2);display:flex;gap:10px;
  padding:11px 14px;font-size:12.5px;color:var(--metin2);flex:1}
.h-hata-ic .ikn{color:var(--kritik);margin-top:1px}
.h-hata-ic code{font-family:var(--mono);font-size:11.5px;color:var(--kritik)}
.h-sayilar{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--cizgi);
  border-top:1px solid var(--cizgi);border-radius:0 0 var(--r) var(--r);overflow:hidden}
.h-sayilar div{background:var(--yuzey);padding:10px 17px}
.h-sayilar dt{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--soluk)}
.h-sayilar dd{font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:-.03em;
  margin-top:1px;font-variant-numeric:tabular-nums}

/* ── sihirbaz ──────────────────────────────── */
.perde{position:fixed;inset:0;background:rgba(16,26,38,.42);display:grid;
  place-items:center;padding:24px;z-index:20}
.modal{background:var(--yuzey);border-radius:14px;width:min(560px,100%);
  max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px -12px rgba(16,26,38,.4)}
.m-ust{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 0}
.m-ust h2{font-size:17px;font-weight:700;letter-spacing:-.028em}
.m-ust p{color:var(--soluk);font-size:13px;margin-top:2px}
.m-kapat{margin-left:auto;border:0;background:none;font-size:19px;color:var(--soluk);
  cursor:pointer;line-height:1;padding:2px 4px;flex:none}
.m-kapat:hover{color:var(--metin)}
.adimlar{display:flex;align-items:center;gap:7px;padding:16px 22px 4px}
.adim{display:flex;align-items:center;gap:7px;flex:1}
.adim .yuvarlak{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--yuzey2);color:var(--soluk);flex:none;
  border:1px solid var(--cizgi)}
.adim.gecti .yuvarlak{background:var(--olumlu);color:#fff;border-color:var(--olumlu)}
.adim.simdi .yuvarlak{background:var(--murekkep);color:#fff;border-color:var(--murekkep)}
.adim .et{font-size:11.5px;font-weight:600;color:var(--soluk);white-space:nowrap}
.adim.simdi .et{color:var(--metin)}
.adim .cizgi{flex:1;height:1px;background:var(--cizgi);min-width:8px}
.adim:last-child .cizgi{display:none}
.m-ic{padding:18px 22px}
.c-baslik{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--soluk);margin-bottom:10px}
.m-alt{display:flex;align-items:center;gap:9px;padding:0 22px 20px}
.m-alt .dugme:last-child{margin-left:auto}

.saglayicilar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sag-kart{display:flex;align-items:center;gap:11px;padding:13px 14px;text-align:left;
  border:1px solid var(--cizgi);border-radius:var(--r2);background:var(--yuzey);
  cursor:pointer;transition:border-color .12s,background .12s}
.sag-kart:hover{background:var(--yuzey2)}
.sag-kart.secili{border-color:var(--murekkep);background:var(--mrk-yum)}
.sag-kart .amb{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  font-size:14px;flex:none;background:var(--yuzey2);color:var(--metin2)}
.sag-kart.secili .amb{background:#fff;color:var(--mrk-metin)}
.sag-kart b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.014em}
.sag-kart small{color:var(--soluk);font-size:11.5px}

.form-satir{margin-bottom:13px}
.form-satir label{display:block;font-size:12px;font-weight:600;color:var(--metin2);
  margin-bottom:5px;letter-spacing:-.005em}
.form-satir input{width:100%;padding:9px 12px;border:1px solid var(--cizgi2);
  border-radius:var(--r2);background:var(--yuzey);font-size:13.5px}
.form-satir input:focus{outline:2px solid var(--murekkep);outline-offset:-1px;border-color:transparent}
.form-satir input[readonly]{background:var(--yuzey2);color:var(--soluk);font-family:var(--mono);font-size:12.5px}
.form-ikili{display:grid;grid-template-columns:1fr 96px;gap:10px}
.ipuc{font-size:12px;color:var(--soluk);margin-top:5px;line-height:1.45}
.gelismis{border:0;background:none;color:var(--murekkep);font-size:12.5px;font-weight:600;
  cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.guvenlik{display:flex;gap:9px;padding:11px 13px;background:var(--olm-yum);
  border-radius:var(--r2);font-size:12.5px;color:var(--olumlu);margin-top:14px}
.guvenlik b{font-weight:700}

.test-liste{display:flex;flex-direction:column;gap:2px}
.test-adim{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r2);
  font-size:13px;color:var(--soluk)}
.test-adim.calisiyor{background:var(--yuzey2);color:var(--metin2)}
.test-adim.tamam{color:var(--metin2)}
.test-adim.hata{background:var(--krt-yum);color:var(--kritik)}
.test-adim .isaret{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  font-size:10px;font-weight:700;flex:none;background:var(--cizgi);color:var(--soluk)}
.test-adim.tamam .isaret{background:var(--olumlu);color:#fff}
.test-adim.hata .isaret{background:var(--kritik);color:#fff}
.test-adim.calisiyor .isaret{background:var(--murekkep);color:#fff;animation:nabiz 1s infinite}
@keyframes nabiz{0%,100%{opacity:1}50%{opacity:.45}}
.test-adim .sonuc{margin-left:auto;font-family:var(--mono);font-size:11.5px}
.test-ozet{margin-top:14px;padding:14px 15px;background:var(--olm-yum);border-radius:var(--r2);
  display:flex;align-items:center;gap:11px}
.test-ozet b{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--olumlu);
  letter-spacing:-.03em}
.test-ozet span{font-size:13px;color:var(--olumlu)}

.secenek{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--cizgi);
  border-radius:var(--r2);cursor:pointer;margin-bottom:9px;background:var(--yuzey);
  text-align:left;width:100%}
.secenek:hover{background:var(--yuzey2)}
.secenek.secili{border-color:var(--murekkep);background:var(--mrk-yum)}
.secenek .kutucuk{width:17px;height:17px;border-radius:50%;border:2px solid var(--cizgi2);
  flex:none;display:grid;place-items:center}
.secenek.secili .kutucuk{border-color:var(--murekkep)}
.secenek.secili .kutucuk::after{content:"";width:8px;height:8px;border-radius:50%;
  background:var(--murekkep)}
.secenek b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.012em}
.secenek small{color:var(--soluk);font-size:12px}

/* ── kategoriler ve kurallar ───────────────── */
.kat-satir{display:flex;align-items:center;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--cizgi)}
.kat-satir:last-child{border-bottom:0}
.kat-renk{width:11px;height:11px;border-radius:3px;flex:none}
.kat-ad{display:block;font-size:14px;font-weight:600;letter-spacing:-.016em}
.kat-ac{display:block;font-size:12.5px;color:var(--soluk);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kat-yon{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;flex:none}
.kat-say{font-family:var(--mono);font-size:12.5px;color:var(--soluk);width:60px;
  text-align:right;flex:none;font-variant-numeric:tabular-nums}

.kural{display:flex;align-items:center;gap:9px;padding:12px 16px;
  border-bottom:1px solid var(--cizgi);flex-wrap:wrap}
.kural:last-child{border-bottom:0}
.kural .no{font-family:var(--mono);font-size:11px;color:var(--soluk);width:16px;flex:none}
.kural .par{font-size:12.5px;color:var(--soluk);flex:none}
.kural .kos{font-family:var(--mono);font-size:12px;background:var(--yuzey2);
  border:1px solid var(--cizgi);padding:3px 8px;border-radius:5px}
.kural .son{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.anahtar{width:34px;height:19px;border-radius:10px;background:var(--olumlu);position:relative;
  flex:none;cursor:pointer;border:0;padding:0}
.anahtar::after{content:"";position:absolute;top:2px;right:2px;width:15px;height:15px;
  border-radius:50%;background:#fff}
.anahtar.kapali{background:var(--cizgi2)}
.anahtar.kapali::after{right:auto;left:2px}

.elen{display:flex;align-items:baseline;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--cizgi)}
.elen:last-child{border-bottom:0}
.motor{display:flex;align-items:center;gap:14px;padding:15px 17px;background:var(--olm-yum);
  border-radius:var(--r);margin-bottom:14px}
.motor > b{font-family:var(--mono);font-size:25px;font-weight:700;color:var(--olumlu);
  letter-spacing:-.04em;line-height:1;flex:none}
.motor .ne{font-size:13px;color:var(--olumlu);line-height:1.5}
.motor .ne b{font:inherit;font-weight:700}

/* ── bilgi tabanı ──────────────────────────── */
.bt{display:flex;align-items:flex-start;gap:13px;padding:15px 17px;
  border-bottom:1px solid var(--cizgi)}
.bt:last-child{border-bottom:0}
.bt-ikon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-size:14px;flex:none;background:var(--mrk-yum);color:var(--mrk-metin)}
.bt.eksik .bt-ikon{background:var(--uyr-yum);color:var(--uyari)}
.bt-ic{flex:1;min-width:0}
.bt-ad{display:block;font-size:14px;font-weight:600;letter-spacing:-.016em}
.bt-alt{display:block;font-size:12.5px;color:var(--soluk);margin-top:2px}
.bt.eksik .bt-alt{color:var(--uyari)}
.bt-kul{font-family:var(--mono);font-size:11.5px;color:var(--soluk);flex:none;
  text-align:right;width:104px}
.bt-kul b{display:block;font-size:14px;font-weight:600;color:var(--metin);letter-spacing:-.03em}

.ogren{display:flex;align-items:center;gap:14px;padding:16px 17px;background:var(--mrk-yum);
  border-radius:var(--r);margin-bottom:14px}
.ogren .im{font-size:20px;flex:none;color:var(--mrk-metin)}
.ogren h3{font-size:14px;font-weight:700;color:var(--mrk-metin);letter-spacing:-.018em;
  margin-bottom:3px}
.ogren p{font-size:12.5px;color:var(--metin2);line-height:1.5;max-width:62ch}
.ogren .dugme{margin-left:auto;flex:none}

.uslup{display:flex;gap:9px;flex-wrap:wrap}
.uslup button{padding:9px 14px;border:1px solid var(--cizgi);background:var(--yuzey);
  border-radius:var(--r2);cursor:pointer;text-align:left}
.uslup button.secili{border-color:var(--murekkep);background:var(--mrk-yum)}
.uslup b{display:block;font-size:13px;font-weight:600;letter-spacing:-.014em}
.uslup small{color:var(--soluk);font-size:11.5px}

/* ── ekip ──────────────────────────────────── */
.kisi-satir{display:flex;align-items:center;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--cizgi)}
.kisi-satir:last-child{border-bottom:0}
.kisi-satir.bekliyor{opacity:.7}
.kisi-bilgi{flex:1;min-width:0}
.kisi-ad{display:block;font-size:14px;font-weight:600;letter-spacing:-.016em}
.kisi-posta{display:block;font-family:var(--mono);font-size:12px;color:var(--soluk);margin-top:1px}
.rol{font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px;white-space:nowrap;flex:none}
.r-sahip{background:var(--metin);color:var(--yuzey)}
.r-yonetici{background:var(--mrk-yum);color:var(--mrk-metin)}
.r-personel{background:var(--yuzey2);color:var(--soluk);border:1px solid var(--cizgi)}

.yakinda-ic{max-width:460px;text-align:center}
.yakinda h2{font-size:19px;font-weight:700;letter-spacing:-.03em;margin-bottom:7px}
.yakinda p{color:var(--soluk);font-size:13.5px;margin-bottom:16px}
.yakinda ul{text-align:left;background:var(--yuzey);border:1px solid var(--cizgi);
  border-radius:var(--r);padding:15px 17px 15px 33px;
  font-size:13px;color:var(--metin2);display:flex;flex-direction:column;gap:6px}

#bildirim{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);

  font-size:13px;font-weight:600;box-shadow:var(--golge-yuk);opacity:0;

#bildirim.gorunur{opacity:1;transform:translate(-50%,0)}

/* ── halka grafik ──────────────────────────── */
function halkaSVG(){
  const ONAY = onayVeri();
  const toplam = ONAY.reduce((t,o) => t + o.adet, 0);
  const r = 58, c = 2 * Math.PI * r, bosluk = 3;
  let ofset = 0;
  const yaylar = ONAY.map(o => {
    const uzunluk = Math.max(o.adet / toplam * c - bosluk, 1);
    const d = "<circle cx=\"73\" cy=\"73\" r=\"" + r + "\" fill=\"none\" stroke=\"" + o.renk +
      "\" stroke-width=\"15\" stroke-linecap=\"round\"" +
      " stroke-dasharray=\"" + uzunluk.toFixed(1) + " " + (c - uzunluk).toFixed(1) + "\"" +
      " stroke-dashoffset=\"" + (-ofset).toFixed(1) + "\"></circle>";
    ofset += o.adet / toplam * c;
    return d;
  }).join("");
  return "<div class=\"halka\"><svg width=\"146\" height=\"146\" viewBox=\"0 0 146 146\" aria-hidden=\"true\">" +
    "<circle cx=\"73\" cy=\"73\" r=\"" + r + "\" fill=\"none\" stroke=\"var(--yuzey2)\" stroke-width=\"15\"></circle>" +
    yaylar + "</svg>" +
    "<div class=\"halka-orta\"><div><b>" + toplam + "</b><small>taslak</small></div></div></div>";
}

function tabTest(t, m){
  if (t === "bana")     return m.sahip === BEN;
  if (t === "sahipsiz") return !m.sahip;
  if (t === "taslak")   return m.durum === "taslak";
  if (t === "geciken")  return m.seviye === "uyr" || m.seviye === "krt";
  return true;
}

// haric: sayacı hesaplarken o boyutu dışarıda bırakır (faceted sayım)
function gecer(m, haric){
  if (haric !== "sekme" && !tabTest(sekme, m)) return false;
  if (haric !== "hesap" && hesapSuz !== "hepsi" && m.hesap !== hesapSuz) return false;
  if (haric !== "kat" && katSuz.length && katSuz.indexOf(m.kategori) === -1) return false;
  if (haric !== "arama" && arama.trim()){
    const q = arama.trim().toLocaleLowerCase("tr");
    const alan = (m.gonderen + " " + (m.firma || "") + " " + m.adres + " " +
                  m.konu + " " + m.onizleme + " " + m.govde).toLocaleLowerCase("tr");
    if (alan.indexOf(q) === -1) return false;
  }
  return true;
}

const bekleyisDk = m => (m.durum === "yanitlandi" || m.durum === "reddedildi") ? -1 : (m.sk || 0);

function suzulmus(){
  const l = MAILLER.filter(m => gecer(m, null));
  if (sira === "bekleyen") l.sort((a,b) => bekleyisDk(b) - bekleyisDk(a));
  else if (sira === "sahipsiz") l.sort((a,b) => (a.sahip ? 1 : 0) - (b.sahip ? 1 : 0) || a.sk - b.sk);
  else l.sort((a,b) => a.sk - b.sk);
  return l;
}

      "\" data-s=\"" + p[0] + "\">" + p[1] + "<i>" + n + "</i></button>";
  }).join("");

  const hs = ["<option value=\"hepsi\">tüm hesaplar</option>"].concat(
    HESAPLAR.map(h => "<option value=\"" + h.id + "\"" + (hesapSuz === h.id ? " selected" : "") + ">" +
      h.adres.split("@")[0] + "@</option>")).join("");

  const siralar = [["yeni","en yeni"],["bekleyen","en uzun bekleyen"],["sahipsiz","sahipsiz önce"]];
  const ss = siralar.map(x => "<option value=\"" + x[0] + "\"" +
    (sira === x[0] ? " selected" : "") + ">" + x[1] + "</option>").join("");

  const katHTML = Object.keys(KATEGORI).map(k => {
    const n = MAILLER.filter(m => gecer(m, "kat") && m.kategori === k).length;
    return "<button class=\"kcip " + (katSuz.indexOf(k) > -1 ? "secili " : "") + (n ? "" : "bos") +
      "\" data-k=\"" + k + "\"><i style=\"background:" + KATEGORI[k].nokta + "\"></i>" +
      KATEGORI[k].ad + "<b>" + n + "</b></button>";
  }).join("");

  const acik = sekme !== "hepsi" || katSuz.length || arama.trim() || hesapSuz !== "hepsi";

  const gorunen = suzulmus().length;
  $("#liste-ust").innerHTML =
    "<div class=\"liste-baslik\"><span class=\"ad\">Gelen kutusu</span>" +
      "<select class=\"hsec\" id=\"hsec\" aria-label=\"Hesap süz\">" + hs + "</select>" +
      "<span class=\"adet\">" + gorunen + " mail</span></div>" +
    "<div class=\"suzgec serit-kaydir\">" + sekmeHTML + "</div>" +
    "<div class=\"suz2\">" +
      "<span class=\"arama\">" + ikon("ara",13) +
        "<input id=\"mail-ara\" type=\"search\" placeholder=\"gönderen, konu, sipariş no\" " +
        "value=\"" + kacar(arama) + "\" aria-label=\"Maillerde ara\"></span>" +
      "<select class=\"hsec\" id=\"sirasec\" aria-label=\"Sırala\">" + ss + "</select>" +
    "</div>" +
    "<div class=\"katsuz serit-kaydir\">" + katHTML +
      (acik ? "<button class=\"kcip temizle\" id=\"suz-temiz\">" + ikon("carpi",12) + "temizle</button>" : "") +
    "</div>";

  $("#liste-ust").querySelectorAll("[data-s]").forEach(b => {
    b.onclick = () => { sekme = b.dataset.s; kutuCiz(); };
  });
  $("#liste-ust").querySelectorAll("[data-k]").forEach(b => {
    b.onclick = () => {
      const k = b.dataset.k, i = katSuz.indexOf(k);
      if (i > -1) katSuz.splice(i, 1); else katSuz.push(k);
      kutuCiz();
    };
  });
  $("#hsec").onchange = e => { hesapSuz = e.target.value; kutuCiz(); };
  $("#sirasec").onchange = e => { sira = e.target.value; kutuCiz(); };
  const t = $("#suz-temiz");
  if (t) t.onclick = suzgecTemiz;
  const ar = $("#mail-ara");
  ar.oninput = e => {
    arama = e.target.value;
    const k = e.target.selectionStart;
    kutuCiz();
    const y = $("#mail-ara");
    if (y){ y.focus(); y.setSelectionRange(k, k); }
  };
}

/* ── detay ─────────────────────────────────── */
function detayCiz(){
  const m = MAILLER.find(x => x.id === secili);
  if (!m){ $("#detay").innerHTML = ""; return; }
  const k = KATEGORI[m.kategori];
  const t = kendiYazim ? "" : (m.taslaklar[taslakIndex] || "");
  const yazilabilir = kendiYazim || m.taslaklar.length;
  const ayniGonderen = MAILLER.filter(x => x.adres === m.adres).length;

  let serit = "";
  if (m.durum === "yanitlandi"){
    serit = "<div class=\"serit olm\">" + ikon("onay",15) + EKIP[m.sahip].ad + " tarafından yanıtlandı — dün 09:40</div>";
  } else if (m.durum === "reddedildi"){
    serit = "<div class=\"serit uyr\">Taslak reddedildi — " + EKIP[m.sahip].ad + " yanıtı elle yazdı.</div>";
  } else if (!m.sahip){
    serit = "<div class=\"serit uyr\">Bu mail henüz kimseye atanmadı, " + m.bekleme + "'dir bekliyor." +
      "<button class=\"dugme ana ufak\" id=\"sahiplen\">Sahiplen</button>" +
      "<button class=\"dugme ufak\" data-devret=\"1\">Başkasına ata</button></div>";
  } else {
    serit = "<div class=\"serit\" style=\"background:var(--yuzey2);color:var(--metin2)\">" +
      "<span class=\"av\" style=\"background:" + EKIP[m.sahip].renk + "\">" + EKIP[m.sahip].bas + "</span>" +
      "<b>" + EKIP[m.sahip].ad + "</b> üzerinde" +
      "<button class=\"dugme ufak\" data-devret=\"1\">Devret</button></div>";
  }

  const ai = "<div class=\"kart ai\"><div class=\"kart-ust\">" +
    "<span class=\"kart-ad\">Yapay zekâ analizi</span>" +
    "<span class=\"cip " + k.sinif + "\">" + k.ad + "</span>" +
    "<span class=\"guven\">güven " + m.guven + "%<span class=\"cubuk\"><i style=\"width:" + m.guven + "%" +
      (m.guven < 80 ? ";background:var(--uyari)" : "") + "\"></i></span></span>" +
    "</div><div class=\"ai-ic\">" +
    "<p class=\"ozet\">" + kacar(m.ozet) + "</p>" +
    (m.alanlar.length
      ? "<dl class=\"alanlar\">" + m.alanlar.map(p =>
          "<div><dt>" + kacar(p[0]) + "</dt><dd>" + kacar(p[1]) + "</dd></div>").join("") + "</dl>"
      : "") +
    (yazilabilir
      ? "<div class=\"taslak-et\"><span>" + (kendiYazim ? "Kendi yanıtın" : "Önerilen yanıt") + "</span>" +
        (!kendiYazim && m.taslaklar.length > 1
          ? "<span class=\"bekleme\">" + (taslakIndex + 1) + "/" + m.taslaklar.length + ". varyant</span>" : "") +
        (kendiYazim ? "<span class=\"cip k-bulten\">yapay zekâ kapalı</span>" : "") +
        "</div><textarea class=\"taslak\" id=\"taslak\" aria-label=\"Yanıt\" " +
        "placeholder=\"" + (kendiYazim ? "Yanıtını buraya yaz" : "") + "\">" + kacar(t) + "</textarea>" +
        "<div class=\"eylemler\">" +
        "<button class=\"dugme ana\" id=\"gonder\">" + (kendiYazim ? "Gönder" : "Onayla ve gönder") + "</button>" +
        (kendiYazim
          ? "<button class=\"dugme\" id=\"taslagadon\">Taslağa dön</button>"
          : "<button class=\"dugme\" id=\"yenidenyaz\">Yeniden yaz</button>" +
            "<button class=\"dugme\" id=\"kendim\">Kendim yazacağım</button>" +
            "<button class=\"dugme\" id=\"reddet\">Reddet</button>") +
        "<span class=\"ipucu\"><kbd>J</kbd> <kbd>K</kbd> gezin · <kbd>E</kbd> sahiplen</span></div>"
      : "<p class=\"ozet\" style=\"color:var(--soluk);margin-top:13px\">Bu mail için bekleyen taslak yok. " +
        "<button class=\"gelismis\" id=\"kendim\">Kendin yaz</button></p>") +
    "</div>" +
    (m.ek
      ? "<div class=\"ekkart\"><div class=\"ekikon\">PDF</div>" +
        "<div style=\"flex:1;min-width:0\"><div class=\"ekad\">" + kacar(m.ek.ad) + " · " + m.ek.boyut + "</div>" +
        "<div class=\"ekozet\">" + kacar(m.ek.ozet) + "</div></div>" +
        "<button class=\"dugme ufak\" data-ekindir=\"" + kacar(m.ek.ad) + "\">İndir</button></div>"
      : "") + "</div>";

  const notlar = "<div class=\"kart notkart\"><div class=\"kart-ust\">" +
    "<span class=\"kart-ad\">Ekip notu</span>" +
    "<span class=\"cip k-bulten\">müşteriye gitmez</span></div>" +
    "<div class=\"not-ic\">" +
    (m.notlar.length
      ? m.notlar.map(n => "<div class=\"not-s\"><div class=\"not-b\"><b>" + n.kim + "</b>" +
          "<span>" + n.vakit + "</span></div>" + kacar(n.metin) + "</div>").join("")
      : "<p class=\"ozet\" style=\"color:var(--soluk)\">Henüz not yok. Bu maille ilgili yaptığın " +
        "aramayı ya da bilgiyi buraya yazarsan ekip görür.</p>") +
    "<div class=\"not-gir\"><input id=\"not-metin\" placeholder=\"Ekip için not ekle\">" +
    "<button class=\"dugme\" id=\"not-ekle\">Ekle</button></div></div></div>";

  const zincir = m.zincir.length
    ? "<button class=\"zincir-ac\" id=\"zincir-ac\">" +
        "<span class=\"zok" + (zincirAcik ? " acik" : "") + "\">" + ikon("ok",13) + "</span>" +
        m.zincir.length + " önceki mesaj</button>" +
      (zincirAcik
        ? "<div class=\"zincir\">" + m.zincir.map(z =>
            "<div class=\"zmesaj" + (z.ben ? " ben" : "") + "\"><div class=\"zust\"><b>" + z.kim + "</b>" +
            "<span>" + z.vakit + "</span></div>" + kacar(z.metin) + "</div>").join("") + "</div>"
        : "")
    : "";

  $("#detay").innerHTML = "<div class=\"detay\">" +
    "<div class=\"d-ust\"><h1 class=\"d-konu\">" + kacar(m.konu) + "</h1>" +
    (m.vip ? "<span class=\"cip vip\" style=\"margin-top:6px\">VIP müşteri</span>" : "") + "</div>" +
    "<div class=\"d-meta\">" +
      "<span class=\"av\" style=\"background:" + k.avatar + ";width:24px;height:24px;font-size:10px\">" +
      kacar(m.gonderen).slice(0,1) + "</span>" +
      "<strong>" + kacar(m.gonderen) + "</strong>" +
      (m.firma ? "<span style=\"color:var(--soluk)\">· " + kacar(m.firma) + "</span>" : "") +
      "<span class=\"d-adres\">&lt;" + kacar(m.adres) + "&gt;</span>" +
      (ayniGonderen > 1
        ? "<button class=\"gecmis-rz\" data-gecmis=\"" + kacar(m.adres) + "\">" +
          ayniGonderen + " mail</button>" : "") +
      "<span style=\"color:var(--cizgi2)\">→</span>" +
      "<span class=\"d-adres\">" + HESAPLAR.find(h => h.id === m.hesap).adres + "</span>" +
      "<span class=\"bekleme\" style=\"margin-left:auto\">" + m.zaman + "</span>" +
    "</div>" + serit + ai + notlar + zincir +
    "<div class=\"kart\"><div class=\"kart-ust\"><span class=\"kart-ad\">Gelen mesaj</span></div>" +
    "<div class=\"govde-metin\">" + kalinla(m.govde) + "</div></div></div>";

  const sh = $("#sahiplen");
  if (sh) sh.onclick = sahiplen;

  document.querySelectorAll("[data-devret]").forEach(b => {
    b.onclick = () => modalAc("devret", m.id);
  });
  document.querySelectorAll("[data-ekindir]").forEach(b => {
    b.onclick = () => bildir(b.dataset.ekindir + " indiriliyor");
  });
  document.querySelectorAll("[data-gecmis]").forEach(b => {
    b.onclick = () => { arama = b.dataset.gecmis; sekme = "hepsi"; katSuz = []; kutuCiz(); };
  });
  const za = $("#zincir-ac");
  if (za) za.onclick = () => { zincirAcik = !zincirAcik; detayCiz(); };

  const ne = $("#not-ekle");
  if (ne){
    const notKaydet = () => {
      const g = $("#not-metin");
      if (!g.value.trim()) return;
      m.notlar.unshift({kim:EKIP[BEN].ad, vakit:"az önce", metin:g.value.trim()});
      bildir("Ekip notu eklendi · müşteriye gitmez");
      detayCiz();
    };
    ne.onclick = notKaydet;
    $("#not-metin").onkeydown = e => { if (e.key === "Enter") notKaydet(); };
  }

  const kd = $("#kendim");
  if (kd) kd.onclick = () => { kendiYazim = true; detayCiz(); };
  const td = $("#taslagadon");
  if (td) td.onclick = () => { kendiYazim = false; detayCiz(); };

  const g = $("#gonder");
  if (g){
    g.onclick = () => {
      if (!$("#taslak").value.trim()){ bildir("Boş yanıt gönderilemez"); return; }
      m.durum = "yanitlandi"; m.sahip = m.sahip || BEN;
      m.okunmamis = false; m.bekleme = "—"; m.seviye = "";
      ONAY[0].adet--; ONAY[1].adet++;
      kendiYazim = false;
      bildir("Yanıt gönderildi · " + m.adres);
      ciz();
    };
    const yz = $("#yenidenyaz");
    if (yz) yz.onclick = () => {
      if (m.taslaklar.length < 2){ bildir("Bu mail için tek varyant üretildi"); return; }
      taslakIndex = (taslakIndex + 1) % m.taslaklar.length;
      detayCiz();
    };
    const rd = $("#reddet");
    if (rd) rd.onclick = () => {
      m.durum = "reddedildi"; m.sahip = m.sahip || BEN;
      m.okunmamis = false; m.bekleme = "—"; m.seviye = "";
      ONAY[0].adet--; ONAY[2].adet++;
      bildir("Taslak reddedildi · yanıtı elle yazabilirsin");
      ciz();
    };
  }
}

        "<span class=\"kutucuk\"></span>" +

      "<span><b>Sahipsiz bırak</b><small>Ekibin tamamına açılır</small></span></button>" : "") +

}

function listeCiz(){
  const ms = suzulmus();
  if (!ms.length){
    $("#liste").innerHTML = "<div class=\"liste-bos\">Bu süzgeçte mail yok." +
      "<button class=\"dugme ufak\" id=\"bos-temiz\">Süzgeci temizle</button></div>";
    const bt = $("#bos-temiz"); if (bt) bt.onclick = suzgecTemiz;
    return;
  }
  if (!ms.some(m => m.id === secili)) secili = ms[0].id;
  $("#liste").innerHTML = ms.map(m => {
    const k = KATEGORI[m.kategori];
    const sahip = m.sahip
      ? "<span class=\"rozet-sahip\"><span class=\"av\" style=\"background:" + EKIP[m.sahip].renk + "\">" +
        EKIP[m.sahip].bas + "</span>" + EKIP[m.sahip].ad.split(" ")[0] + "</span>"
      : "<span class=\"rozet-sahip sahipsiz\">sahipsiz</span>";
    const durumCipi =
      m.durum === "taslak"     ? "<span class=\"cip k-olumlu\">taslak hazır</span>" :
      m.durum === "yanitlandi" ? "<span class=\"cip k-bulten\">yanıtlandı</span>" :
      m.durum === "reddedildi" ? "<span class=\"cip k-sikayet\">taslak reddedildi</span>" : "";
    return "<button class=\"satir " + (m.id === secili ? "secili " : "") + (m.okunmamis ? "okunmamis" : "") + "\" data-id=\"" + m.id + "\">" +
      "<span class=\"av kare\" style=\"background:" + k.avatar + ";width:34px;height:34px;font-size:12.5px\">" +
        kacar(m.gonderen).slice(0,1) + "</span>" +
      "<span class=\"govde\">" +
        "<span class=\"konu\">" + kacar(m.konu) + "</span>" +
        "<span class=\"s1\">" +
          "<span class=\"kat-im\" style=\"background:" + k.nokta + "\" title=\"" + k.ad + "\"></span>" +
          "<span class=\"gonderen\">" + kacar(m.gonderen) + "</span>" +
          (m.vip ? "<span class=\"cip vip\">VIP</span>" : "") +
          "<span class=\"zaman\">" + m.zaman + "</span></span>" +
        "<span class=\"onizleme\">" + kacar(m.onizleme) + "</span>" +
        "<span class=\"s3\">" + durumCipi +
        (m.ek ? "<span class=\"ek\">" + ikon("atac",12) + m.ek.boyut + "</span>" : "") +
        (m.bekleme !== "—" ? "<span class=\"bekleme " + m.seviye + "\">" + m.bekleme + "</span>" : "") +
        sahip + "</span></span></button>";
  }).join("");
  $("#liste").querySelectorAll("[data-id]").forEach(b => {
    b.onclick = () => sec(+b.dataset.id);
  });
}

function kutuCiz(){ suzgecCiz(); listeCiz(); detayCiz(); }

function sahiplen(){
  const m = MAILLER.find(x => x.id === secili);
  if (!m || m.sahip) return;
  m.sahip = BEN;
  m.durum = m.taslaklar.length ? "taslak" : "atandi";
  m.okunmamis = false;
  bildir("Sahiplenildi · " + EKIP[BEN].ad);
  ciz();
}

function sec(id){
  secili = id; taslakIndex = 0;
  const m = MAILLER.find(x => x.id === id);
  if (m) m.okunmamis = false;
  kutuCiz();
}

function hesapBagla(){
  const ekle = $("#hesap-ekle");
  if (ekle) ekle.onclick = () => { mAcik = true; mAdim = 1; mSaglayici = null; mTest = 0; ciz(); };
  document.querySelectorAll("[data-duzelt]").forEach(b => {
    b.onclick = () => { mAcik = true; mAdim = 2; mSaglayici = "m365"; mTest = 0; ciz(); };
  });
  document.querySelectorAll("[data-test]").forEach(b => {
    b.onclick = () => bildir("Bağlantı çalışıyor · son senkron 1 dk önce");
  });
  document.querySelectorAll("[data-ayar]").forEach(b => {
    b.onclick = () => modalAc("hesapAyar", HESAP_DETAY.find(h => h.id === b.dataset.ayar));
  });
  if (!mAcik) return;

  $("#m-kapat").onclick = () => { mAcik = false; ciz(); };
  $("#perde").onclick = e => { if (e.target.id === "perde"){ mAcik = false; ciz(); } };
  const geri = $("#m-geri");
  if (geri) geri.onclick = () => { mAdim--; if (mAdim === 3) mTest = 0; ciz(); };

  document.querySelectorAll("[data-sag]").forEach(b => {
    b.onclick = () => { mSaglayici = b.dataset.sag; ciz(); };
  });
  const gel = $("#g-gelismis");
  if (gel) gel.onclick = () => { mGelismis = !mGelismis; ciz(); };
  document.querySelectorAll("[data-kapsam]").forEach(b => {
    b.onclick = () => { mKapsam = b.dataset.kapsam; ciz(); };
  });

  $("#m-ileri").onclick = () => {
    if (mAdim === 3 && mTest < 4){ testCalistir(); return; }
    if (mAdim === 4){
      mAcik = false;
      bildir("kargo@arkunmobilya.com bağlandı · mailler çekiliyor");
      ciz(); return;
    }
    mAdim++; ciz();
  };
}

function testCalistir(){
  mTest = 0; ciz();
  const ilerle = () => {
    mTest++;
    ciz();
    if (mTest < 4) setTimeout(ilerle, 620);
  };
  setTimeout(ilerle, 500);
}

function ayarBagla(){
  document.querySelectorAll("[data-kural]").forEach(b => {
    b.onclick = () => {
      const r = KURALLAR.find(x => x.id === +b.dataset.kural);
      r.acik = !r.acik;
      bildir(r.acik ? "Kural açıldı" : "Kural kapatıldı");
      ciz();
    };
  });
  document.querySelectorAll("[data-yetki]").forEach(b => {
    b.onclick = () => {
      if (b.dataset.yetki === "sikayet") yetkiSikayet = !yetkiSikayet; else yetkiVip = !yetkiVip;
      bildir("Onay şartı güncellendi");
      ciz();
    };
  });
  document.querySelectorAll("[data-uslup]").forEach(b => {
    b.onclick = () => { uslupSecim = b.dataset.uslup; bildir("Yanıt üslubu güncellendi"); ciz(); };
  });
  document.querySelectorAll("[data-bt]").forEach(b => {
    b.onclick = () => {
      if (b.dataset.bt === "ogren"){ bildir("Son 500 giden mail taranıyor — birkaç dakika sürebilir"); return; }
      modalAc("bt", b.dataset.bt);
    };
  });
  document.querySelectorAll("[data-kd]").forEach(b => {
    b.onclick = () => {
      const v = b.dataset.kd;
      if (v === "yeni" || v === "kural") modalAc("kural", null);
      else bildir(KATEGORI[v].ad + " kategorisi düzenleniyor");
    };
  });
  document.querySelectorAll("[data-kural-duzen]").forEach(b => {
    b.onclick = () => modalAc("kural", KURALLAR.find(x => x.id === +b.dataset.kuralDuzen));
  });
  document.querySelectorAll("[data-ek]").forEach(b => {
    b.onclick = () => modalAc("ekip", b.dataset.ek);
  });
}

      : "<div class=\"form-satir\"><label>E-posta adresi</label>" +
        "<input readonly value=\"" + k.posta + "\"></div>") +

    "<div class=\"c-baslik\" style=\"margin-top:18px\">Rol</div>" +
    roller.map(r => "<button class=\"secenek" +
      ((!yeni && k.rol === r[0]) || (yeni && r[0] === "personel") ? " secili" : "") +
      "\" data-mt=\"Rol: " + r[1] + "\"><span class=\"kutucuk\"></span>" +
      "<span><b>" + r[1] + "</b><small>" + r[2] + "</small></span></button>").join("") +

    "<div class=\"c-baslik\" style=\"margin-top:18px\">Hangi kutuları görsün</div>" +
    HESAPLAR.map(h => "<button class=\"secenek\" data-mt=\"" + h.adres + " erişimi değişti\">" +
      "<span class=\"kutucuk\"></span><span><b style=\"font-family:var(--mono);font-size:13px\">" +
      h.adres + "</b><small>" + (h.saglikli ? "bağlı" : "bağlantı hatası") + "</small></span></button>").join("") +

    "<div class=\"c-baslik\" style=\"margin-top:18px\">Gönderim yetkisi</div>" +
    "<div class=\"kural\" style=\"border:0;padding:9px 0\"><span style=\"font-size:13px\">" +
      "Yapay zekâ taslağını onaysız gönderebilsin</span><span class=\"son\">" +
      "<button class=\"anahtar " + (yeni || !k.onaysiz ? "kapali" : "") +
      "\" data-mt=\"Gönderim yetkisi değişti\" aria-label=\"Ac kapat\"></button></span></div>" +
    "<p class=\"ipuc\">Yeni katılan personelde bunu ilk ay kapalı bırakmak hem eğitim " +
    "hem kalite güvencesi işlevi görür.</p>" +
    "</div>" +

    "<div class=\"m-alt\">" +
      (yeni ? "" : "<button class=\"dugme\" data-mt=\"Kullanıcı erişimi kaldırılacak\" " +
        "style=\"color:var(--kritik);border-color:var(--kritik)\">Erişimi kaldır</button>") +
      "<button class=\"dugme ana\" data-mk=\"1\">" + (yeni ? "Daveti gönder" : "Kaydet") + "</button></div>";
}

function modalHTML(){
  if (!acikModal) return "";
  const t = acikModal.tur;
  let ic = "";
  if (t === "hesapAyar") ic = hesapAyarHTML(acikModal.veri);
  else if (t === "kural") ic = kuralDuzenHTML(acikModal.veri);
  else if (t === "bt")    ic = btDuzenHTML(acikModal.veri);
  else if (t === "ekip")  ic = ekipDuzenHTML(acikModal.veri);
  else if (t === "devret") ic = devretHTML(acikModal.veri);
  return "<div class=\"perde\" id=\"m-perde\"><div class=\"modal\" role=\"dialog\">" + ic + "</div></div>";
}

function modalBagla(){
  if (!acikModal) return;
  document.querySelectorAll("[data-mk]").forEach(b => { b.onclick = modalKapat; });
  const p = $("#m-perde");
  if (p) p.onclick = e => { if (e.target.id === "m-perde") modalKapat(); };
  document.querySelectorAll("[data-mt]").forEach(b => {
    b.onclick = () => bildir(b.dataset.mt);
  });
  document.querySelectorAll("[data-ms]").forEach(b => {
    b.onclick = () => bildir("Kontrol sıklığı " + b.dataset.ms + " dakika olarak ayarlandı");
  });
  document.querySelectorAll("[data-hkaldir]").forEach(b => {
    b.onclick = () => {
      const i = HESAP_DETAY.findIndex(x => x.id === b.dataset.hkaldir);
      const ad = HESAP_DETAY[i].adres;
      HESAP_DETAY.splice(i, 1);
      bildir(ad + " bağlantısı kaldırıldı · mailleri kendi sunucunuzda duruyor");
      modalKapat();
    };
  });
  document.querySelectorAll("[data-ata]").forEach(b => {
    b.onclick = () => {
      const m = MAILLER.find(x => x.id === acikModal.veri);
      const k = b.dataset.ata;
      if (k === "yok"){ m.sahip = null; m.durum = m.durum === "atandi" ? "yeni" : m.durum;
        bildir("Sahipsiz bırakıldı · ekibin tamamına açıldı"); }
      else { m.sahip = k; m.okunmamis = false;
        if (m.durum === "yeni") m.durum = m.taslaklar.length ? "taslak" : "atandi";
        bildir(EKIP[k].ad + " kişisine atandı"); }
      modalKapat();
    };
  });
}

/* ── ortak ─────────────────────────────────── */
let zamanlayici;
function bildir(metin){
  const b = $("#bildirim");
  b.textContent = metin;
  b.classList.add("gorunur");
  clearTimeout(zamanlayici);
  zamanlayici = setTimeout(() => b.classList.remove("gorunur"), 2400);
}

document.addEventListener("keydown", e => {
  if (sayfa !== "kutu") return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const ms = suzulmus();
  const i = ms.findIndex(x => x.id === secili);
  if (e.key === "j" || e.key === "ArrowDown"){ e.preventDefault(); if (i > -1 && i < ms.length - 1) sec(ms[i+1].id); }
  if (e.key === "k" || e.key === "ArrowUp"){ e.preventDefault(); if (i > 0) sec(ms[i-1].id); }
  if (e.key === "e") sahiplen();
});

function amblemCiz(){
  const a = $("#amblem");
  if (a && !a.childElementCount) a.innerHTML = ikon("zarf", 19);
  const c = $("#cikis");
  if (c && !c.childElementCount) c.innerHTML = ikon("cikis", 16);
}

function ciz(){
  amblemCiz();
  if (!oturum){
    document.querySelector(".uygulama").style.display = "none";
    $("#ustkat").innerHTML = girisHTML();
    girisBagla();
    return;
  }
  document.querySelector(".uygulama").style.display = "";
  navCiz();
  const cq = $("#cikis");
  if (cq) cq.onclick = () => { oturum = false; sayfa = "pano"; ciz(); };
  if (sayfa === "pano"){ $("#sahne").innerHTML = panoHTML(); panoBagla(); }
  else if (sayfa === "kutu"){ $("#sahne").innerHTML = kutuHTML(); kutuCiz(); }
  else if (sayfa === "hesap"){ $("#sahne").innerHTML = hesapHTML(); hesapBagla(); }
  else if (sayfa === "kural"){ $("#sahne").innerHTML = kuralHTML(); ayarBagla(); }
  else if (sayfa === "sablon"){ $("#sahne").innerHTML = sablonHTML(); ayarBagla(); }
  else if (sayfa === "ekip"){ $("#sahne").innerHTML = ekipHTML(); ayarBagla(); }
  $("#ustkat").innerHTML = modalHTML();
  modalBagla();
}
ciz();
</script>
