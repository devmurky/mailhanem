<title>Mailhanem Operatör</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* Müşteri paneliyle aynı dil, tek tema — her koşulda beyaz. */
  --yuzey:#FFFFFF; --yuzey2:#F4F6F9;
  --cizgi:#E6EAEF; --cizgi2:#D4DAE2;
  --metin:#16202B; --metin2:#485664; --soluk:#64717F;
  --murekkep:#1D4E7C; --mrk-yum:#EAF0F6; --mrk-metin:#1A4570;
  --olumlu:#0F7154; --olm-yum:#E3F2EC;
  --uyari:#8A5A07;  --uyr-yum:#FBF1DF;
  --kritik:#B23A40; --krt-yum:#FBE9EA;
  --serit:#12314F; --serit-metin:#A8C2DA;
  --r:11px; --r2:8px;
  --ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
}
/* ── tarayıcı yüzeyleri: seçim, imleç, kaydırma çubuğu ── */
::selection{background:var(--mrk-yum);color:var(--mrk-metin)}
html{scrollbar-color:var(--cizgi2) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--cizgi2);border-radius:6px;
  border:3px solid var(--yuzey);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--soluk);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
input,textarea,select{caret-color:var(--murekkep)}
input::placeholder{color:var(--soluk)}
.ikn{flex:none;display:block}

/* tek yetkili hareket */
@keyframes yerlesir{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}
*{box-sizing:border-box}
body{background:var(--yuzey);color-scheme:light;color:var(--metin);font-family:var(--ui);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--murekkep);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3,p,dl,dd,ul{margin:0}

.uygulama{height:100dvh;min-height:640px;display:grid;grid-template-rows:auto 1fr}

.serit{background:var(--serit);color:var(--serit-metin);display:flex;align-items:center;
  gap:11px;padding:9px 16px;font-size:12px}
.serit b{color:#fff;font-weight:700;letter-spacing:.1em;font-size:11px;text-transform:uppercase}
.serit .ayrac{width:1px;height:14px;background:rgba(255,255,255,.2)}
.serit .ortam{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px}
.serit .ortam i{width:6px;height:6px;border-radius:50%;background:#3DD68C;display:block}

.govde{display:grid;grid-template-columns:232px 1fr;overflow:hidden}
.yannav{border-right:1px solid var(--cizgi);padding:18px 12px 14px;
  display:flex;flex-direction:column;overflow-y:auto}
.nav-marka{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:20px}
.nav-marka .amblem{width:34px;height:34px;border-radius:9px;flex:none;background:var(--serit);
  display:grid;place-items:center;color:#fff;font-size:14px}
.nav-marka b{font-size:15px;font-weight:700;letter-spacing:-.026em;display:block}
.nav-marka small{color:var(--soluk);font-size:11.5px}
.nav-bolum{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--soluk);padding:0 11px;margin:16px 0 6px}
.nav-oge{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 11px;
  border:0;background:none;border-radius:var(--r2);cursor:pointer;color:var(--metin2);
  font-size:13.5px;font-weight:500;margin-bottom:2px;transition:background .12s,color .12s}
.nav-oge:hover{background:var(--yuzey2);color:var(--metin)}
.nav-oge.aktif{background:var(--mrk-yum);color:var(--mrk-metin);font-weight:600}
.nav-oge .ikon{width:16px;text-align:center;font-size:13px;flex:none;opacity:.85}
.nav-oge .et{flex:1}
.nav-oge .sayi{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;
  border-radius:9px;background:var(--yuzey2);color:var(--soluk)}
.nav-oge .sayi.dikkat{background:var(--krt-yum);color:var(--kritik)}
.nav-alt{margin-top:auto;padding:12px 11px 0;border-top:1px solid var(--cizgi);
  display:flex;align-items:center;gap:10px}
.nav-alt b{display:block;font-size:13px;font-weight:600}
.nav-alt small{color:var(--soluk);font-size:11.5px}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;
  flex:none;width:30px;height:30px;font-size:11.5px;background:var(--serit)}
.av.kare{border-radius:8px;width:32px;height:32px;font-size:12px;letter-spacing:-.02em}

.sahne{overflow-y:auto}
.sayfa{padding:24px 28px 46px;max-width:1320px;animation:yerlesir .22s cubic-bezier(.16,1,.3,1)}
.sayfa-ust{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.sayfa-ust h1{font-size:23px;font-weight:700;letter-spacing:-.035em}
.sayfa-ust p{color:var(--soluk);font-size:13.5px;margin-top:3px}
.ornek{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--uyari);background:var(--uyr-yum);padding:4px 8px;border-radius:5px;flex:none}

/* ── istatistik + eğilim ───────────────────── */
.kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(214px,1fr));gap:13px;margin-bottom:22px}
.skart{padding:14px 16px;border:1px solid var(--cizgi);border-radius:var(--r)}
.skart dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--soluk);margin-bottom:6px}
.skart .deger{display:flex;align-items:flex-end;gap:9px}
.skart dd{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.04em;
  line-height:1;font-variant-numeric:tabular-nums}
.kivilcim{margin-left:auto;flex:none;line-height:0}
.skart .not{font-size:12px;color:var(--soluk);margin-top:8px;display:flex;align-items:center;gap:5px}
.yon{font-weight:700;font-family:var(--ui)}
.yon.iyi{color:var(--olumlu)} .yon.kotu{color:var(--kritik)}

.bolum{font-size:15px;font-weight:700;letter-spacing:-.024em;margin:0 0 11px;
  display:flex;align-items:center;gap:9px}
.bolum .sayi{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--soluk);
  background:var(--yuzey2);padding:2px 8px;border-radius:9px}
.bolum .aciklayici{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--soluk)}

/* ── iş kuyruğu ────────────────────────────── */
.triyaj{display:flex;flex-direction:column;gap:9px;margin-bottom:26px}
.tsatir{display:flex;align-items:center;gap:13px;padding:13px 16px;border:1px solid var(--cizgi);
  border-radius:var(--r);background:var(--yuzey)}
.tsatir.kritik{background:var(--krt-yum);border-color:#F0CFD1}
.tsatir.uyari{background:var(--uyr-yum);border-color:#EBD9B4}
.tsatir.bitti{opacity:.55}
.tsatir .ne{flex:1;min-width:0}
.tsatir .firma{display:block;font-size:14px;font-weight:600;letter-spacing:-.016em}
.tsatir .aciklama{display:block;font-size:12.5px;color:var(--metin2);margin-top:2px}
.tsatir .aciklama code{font-family:var(--mono);font-size:11.5px}
.tsatir .sure{font-family:var(--mono);font-size:11.5px;color:var(--soluk);flex:none}
.tsatir.kritik .sure{color:var(--kritik);font-weight:600}
/* ── demo talebi kuyruğu ── */
.talep-satir{display:flex;align-items:flex-start;gap:13px;padding:14px 16px;
  border:1px solid var(--cizgi);border-radius:var(--r);background:var(--yuzey)}
.talep-satir.yeni{background:var(--uyr-yum);border-color:#EBD9B4}
.talep-satir.kapandi{opacity:.58}
.talep-satir .av.kare{margin-top:1px}
.talep-ne{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.talep-kim{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.talep-kim b{font-size:14.5px;font-weight:600;letter-spacing:-.018em}
.talep-kim .ad{font-size:13px;color:var(--metin2)}
.talep-bilgi{font-size:12.5px;color:var(--metin2);display:flex;align-items:center;
  gap:6px;flex-wrap:wrap}
.talep-bilgi a{color:var(--mrk-metin);text-decoration:none;
  text-decoration-line:underline;text-decoration-color:var(--cizgi2);text-underline-offset:2px}
.talep-bilgi a:hover{text-decoration-color:var(--murekkep)}
.talep-bilgi .ayrac{color:var(--cizgi2)}
.talep-not{display:flex;align-items:flex-start;gap:7px;margin-top:3px;
  font-size:12.5px;line-height:1.5;color:var(--metin2);
  padding:7px 10px;border-radius:var(--r2);background:var(--yuzey2)}
.talep-satir.yeni .talep-not{background:rgba(255,255,255,.72)}
.talep-not .ikn{margin-top:2px;color:var(--soluk)}
.talep-satir .sure{font-family:var(--mono);font-size:11.5px;color:var(--soluk);
  flex:none;padding-top:4px;width:106px;text-align:right}
.talep-satir .rozet{margin-top:2px}
.talep-eylem{display:flex;align-items:center;gap:7px;flex:none;padding-top:1px}
.talep-suz{margin-left:auto;display:inline-flex;gap:2px;padding:2px;
  background:var(--yuzey2);border-radius:var(--r2)}
.talep-suz button{border:0;cursor:pointer;background:transparent;color:var(--metin2);
  font:600 12.5px/1 var(--ui);padding:6px 11px;border-radius:6px}
.talep-suz button.etkin{background:var(--yuzey);color:var(--metin);
  box-shadow:0 1px 2px rgba(22,32,43,.12)}
.talep-bos{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:44px 20px;border:1px dashed var(--cizgi2);border-radius:var(--r);
  color:var(--soluk);text-align:center}
.talep-bos .ikn{color:var(--olumlu)}
.talep-bos b{font-size:14.5px;color:var(--metin);letter-spacing:-.016em}
.talep-bos span{font-size:13px}
.r-kapali{background:var(--yuzey2);color:var(--soluk)}
@media (max-width:920px){
  .talep-satir{flex-wrap:wrap}
  .talep-satir .sure{width:auto;text-align:left;padding-top:0}
  .talep-eylem{width:100%;padding-top:4px}
}

.rozet{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;flex:none}
.r-kritik{background:var(--kritik);color:#fff}
.r-uyari{background:var(--uyr-yum);color:var(--uyari)}
.r-bilgi{background:var(--mrk-yum);color:var(--mrk-metin)}
.r-bitti{background:var(--olm-yum);color:var(--olumlu)}

.dugme{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r2);
  border:1px solid var(--cizgi2);background:var(--yuzey);font-size:13px;font-weight:600;
  cursor:pointer;letter-spacing:-.01em;white-space:nowrap;flex:none;
  transition:background .12s,border-color .12s}
.dugme:hover{background:var(--yuzey2);border-color:var(--soluk)}
.dugme.ana{background:var(--murekkep);border-color:var(--murekkep);color:#fff}
.dugme.ana:hover{filter:brightness(1.12)}
.dugme.ufak{padding:5px 10px;font-size:12.5px}
.dugme.sade{border-color:transparent;color:var(--soluk);padding:5px 8px;font-size:12.5px}
.dugme.sade:hover{background:var(--yuzey2);color:var(--metin);border-color:transparent}

/* ── araç çubuğu ───────────────────────────── */
.arac{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.arama{position:relative;flex:none}
.arama input{width:230px;padding:7px 11px 7px 30px;border:1px solid var(--cizgi);
  border-radius:var(--r2);background:var(--yuzey2);font-size:13px}
.arama svg{position:absolute;left:10px;top:9px;color:var(--soluk)}
.sirala-not{margin-left:auto;font-size:12.5px;color:var(--soluk)}

/* ── tablo ─────────────────────────────────── */
.tablo-sar{border:1px solid var(--cizgi);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1020px}
th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--soluk);padding:0;border-bottom:1px solid var(--cizgi);white-space:nowrap;
  background:var(--yuzey2)}
th button{width:100%;text-align:inherit;padding:11px 14px;border:0;background:none;
  font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:5px}
th.sag button{justify-content:flex-end}
th button:hover{color:var(--metin)}
th button .ok{opacity:0;display:inline-flex;transition:transform .15s}
th button.etkin .ok{transform:rotate(90deg)}
th button.etkin.ters .ok{transform:rotate(-90deg)}
th button.etkin{color:var(--mrk-metin)}
th button.etkin .ok{opacity:1}
th.dokunma{padding:11px 14px}
th.sag,td.sag{text-align:right}
td{padding:11px 14px;border-bottom:1px solid var(--cizgi);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--yuzey2)}
tbody tr.secili{background:var(--mrk-yum)}
.mus{display:flex;align-items:center;gap:10px}
.mus b{font-weight:600;letter-spacing:-.014em;display:block}
.mus small{color:var(--soluk);font-size:11.5px;font-family:var(--mono)}
.sayi-h{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.plan{font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;white-space:nowrap}
.p-kurumsal{background:var(--mrk-yum);color:var(--mrk-metin)}
.p-pro{background:var(--olm-yum);color:var(--olumlu)}
.p-baslangic{background:var(--yuzey2);color:var(--soluk)}
.p-deneme{background:var(--uyr-yum);color:var(--uyari)}

/* sağlık skoru — renk tek başına anlam taşımaz, sayı hep yanında */
.saglik{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.saglik b{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;
  min-width:22px;text-align:right}
.saglik .ray{width:44px;height:6px;background:var(--yuzey2);border-radius:3px;overflow:hidden;flex:none}
.saglik .ray i{display:block;height:100%;border-radius:3px}
.s-iyi b{color:var(--olumlu)}   .s-iyi .ray i{background:var(--olumlu)}
.s-orta b{color:var(--uyari)}   .s-orta .ray i{background:var(--uyari)}
.s-kotu b{color:var(--kritik)}  .s-kotu .ray i{background:var(--kritik)}

.marj{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.marj.dusuk{color:var(--uyari)}
.marj.eksi{color:var(--kritik)}
.durum-n{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.durum-n i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--olumlu)}
.durum-n.kotu i{background:var(--kritik)}
.durum-n.bekle i{background:var(--uyari)}

.dip{font-size:12.5px;color:var(--soluk);margin-top:13px;max-width:76ch;line-height:1.55}
.dip b{color:var(--metin2)}

/* ── yan panel ─────────────────────────────── */
.perde{position:fixed;inset:0;background:rgba(16,26,38,.4);z-index:20}
.cekmece{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--yuzey);
  box-shadow:-14px 0 40px -14px rgba(16,26,38,.35);z-index:21;overflow-y:auto;
  display:flex;flex-direction:column}
.c-ust{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 16px;
  border-bottom:1px solid var(--cizgi);position:sticky;top:0;background:var(--yuzey);z-index:2}
.c-ust h2{font-size:18px;font-weight:700;letter-spacing:-.03em}
.c-ust .alt{color:var(--soluk);font-size:12.5px;margin-top:3px;font-family:var(--mono)}
.c-kapat{margin-left:auto;border:0;background:none;font-size:19px;color:var(--soluk);
  cursor:pointer;line-height:1;padding:2px 5px;flex:none}
.c-kapat:hover{color:var(--metin)}
.c-ic{padding:18px 22px 28px;display:flex;flex-direction:column;gap:22px}
.c-baslik{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--soluk);margin-bottom:10px}

.skor-ust{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.skor-buyuk{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1}
.skor-yorum{font-size:13px;color:var(--metin2)}
.kirilim{display:flex;flex-direction:column;gap:9px}
.kir{display:grid;grid-template-columns:112px 1fr 58px;align-items:center;gap:10px;font-size:12.5px}
.kir .ad{color:var(--metin2)}
.kir .ray{height:6px;background:var(--yuzey2);border-radius:3px;overflow:hidden}
.kir .ray i{display:block;height:100%;background:var(--murekkep);border-radius:3px}
.kir .puan{font-family:var(--mono);font-size:12px;text-align:right;color:var(--soluk);
  font-variant-numeric:tabular-nums}

.hesap-satir{display:flex;align-items:baseline;gap:10px;padding:8px 0;
  border-bottom:1px dashed var(--cizgi);font-size:13px}
.hesap-satir:last-child{border-bottom:0}
.hesap-satir .ad{color:var(--metin2)}
.hesap-satir .aciklayici{font-size:11.5px;color:var(--soluk)}
.hesap-satir .tut{margin-left:auto;font-family:var(--mono);font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.hesap-satir.sonuc{border-top:2px solid var(--metin);border-bottom:0;margin-top:4px;padding-top:11px}
.hesap-satir.sonuc .ad{font-weight:700;color:var(--metin)}
.hesap-satir.sonuc .tut{font-size:16px}
.eksi{color:var(--kritik)}

.notlar{display:flex;flex-direction:column;gap:9px}
.not-k{padding:11px 13px;background:var(--yuzey2);border-radius:var(--r2);font-size:13px;
  color:var(--metin2)}
.not-k .ust{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.not-k .kim{font-size:11.5px;font-weight:600;color:var(--metin)}
.not-k .vakit{font-family:var(--mono);font-size:11px;color:var(--soluk);margin-left:auto}
.not-ekle{display:flex;gap:8px;margin-top:4px}
.not-ekle input{flex:1;padding:8px 11px;border:1px solid var(--cizgi2);border-radius:var(--r2);
  font-size:13px;background:var(--yuzey)}
.c-eylem{display:flex;gap:9px;flex-wrap:wrap;padding-top:4px}

/* ── sistem ve anahtarlar ──────────────────── */
.kural-kutu{display:flex;gap:13px;padding:15px 17px;background:var(--mrk-yum);
  border-radius:var(--r);margin-bottom:20px;max-width:78ch}
.kural-kutu .im{font-size:17px;color:var(--mrk-metin);flex:none;line-height:1.3}
.kural-kutu h3{font-size:13.5px;font-weight:700;color:var(--mrk-metin);margin-bottom:5px;
  letter-spacing:-.014em}
.kural-kutu p{font-size:13px;color:var(--metin2);line-height:1.55}
.kural-kutu code{font-family:var(--mono);font-size:12px;background:var(--yuzey);
  padding:1px 5px;border-radius:4px}

.ent{border:1px solid var(--cizgi);border-radius:var(--r);margin-bottom:11px}
.ent.uyari{border-color:#EBD9B4}
.ent-ust{display:flex;align-items:center;gap:12px;padding:14px 16px}
.ent-ikon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  font-size:15px;flex:none;background:var(--mrk-yum);color:var(--mrk-metin)}
.ent.uyari .ent-ikon{background:var(--uyr-yum);color:var(--uyari)}
.ent-bilgi{flex:1;min-width:0}
.ent-ad{display:block;font-size:14px;font-weight:600;letter-spacing:-.016em}
.ent-ne{display:block;font-size:12.5px;color:var(--soluk);margin-top:1px}
.ent-env{font-family:var(--mono);font-size:11.5px;color:var(--metin2);
  background:var(--yuzey2);padding:4px 9px;border-radius:5px;flex:none}

/* ── sağlık skoru: dört bileşen, hepsi görünür ── */
function skorKirilim(m){
  const onceki = m.hacim[3] || m.hacim[5] || 1;
  const oran = m.plan === "deneme" ? 1.0 : m.hacim[5] / onceki;
  const buyume   = Math.max(0, Math.min(1, (oran - 0.7) / 0.6));
  const aktiflik = m.kullanici ? m.aktif / m.kullanici : 0;
  const kullanim = m.onay;
  const yuk      = Math.max(0, 1 - m.destek / 4);
  return [
    {ad:"Hacim eğilimi", pay:buyume,   agirlik:35},
    {ad:"Aktif kullanıcı", pay:aktiflik, agirlik:30},
    {ad:"Taslak onayı",  pay:kullanim, agirlik:20},
    {ad:"Destek yükü",   pay:yuk,      agirlik:15}
  ];
}
const skor = m => Math.round(skorKirilim(m).reduce((t,k) => t + k.pay * k.agirlik, 0));
const skorSinif = s => s >= 70 ? "s-iyi" : s >= 45 ? "s-orta" : "s-kotu";
const skorYorum = s => s >= 70 ? "Sağlıklı — büyüme veya referans için uygun"
                     : s >= 45 ? "İzlemede — bir bileşen zayıflamış"
                               : "Kayıp riski yüksek — bu ay temas edilmeli";

/* ── net marj: senin zamanın dahil ─────────── */
function marjHesap(m){
  const altyapiPay = ALTYAPI / MUSTERILER.length;
  const destekBedel = m.destek * SAAT_UCRET;
  const net = m.ucret - m.ai - altyapiPay - destekBedel;
  return {altyapiPay, destekBedel, net,
          brutY: m.ucret ? Math.round((m.ucret - m.ai) / m.ucret * 100) : null,
          netY:  m.ucret ? Math.round(net / m.ucret * 100) : null};
}

/* ── kıvılcım çizgisi (tek seri, tek renk) ─── */
function kivilcim(dizi, renk, g, y){
  g = g || 74; y = y || 26;
  const enB = Math.max.apply(null, dizi), enK = Math.min.apply(null, dizi);
  const araliq = (enB - enK) || 1;
  const nokta = dizi.map((v,i) => {
    const x = (i / (dizi.length - 1)) * (g - 2) + 1;
    const yy = y - 3 - ((v - enK) / araliq) * (y - 8);
    return x.toFixed(1) + "," + yy.toFixed(1);
  });
  const sonX = (g - 1).toFixed(1);
  const sonY = (y - 3 - ((dizi[dizi.length-1] - enK) / araliq) * (y - 8)).toFixed(1);
  return "<svg width=\"" + g + "\" height=\"" + y + "\" viewBox=\"0 0 " + g + " " + y + "\" aria-hidden=\"true\">" +
    "<polyline points=\"" + nokta.join(" ") + "\" fill=\"none\" stroke=\"" + renk +
    "\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></polyline>" +
    "<circle cx=\"" + sonX + "\" cy=\"" + sonY + "\" r=\"2.4\" fill=\"" + renk + "\"></circle></svg>";
}
const degisim = d => Math.round((d[d.length-1] - d[d.length-2]) / d[d.length-2] * 100);

function siralanmis(){
  const l = MUSTERILER.filter(m =>
    !aramaMetni || (m.ad + " " + m.alan).toLowerCase().includes(aramaMetni.toLowerCase()));
  const anahtar = m => {
    if (siraAlan === "ad") return m.ad;
    if (siraAlan === "skor") return skor(m);
    if (siraAlan === "net") return marjHesap(m).netY === null ? -999 : marjHesap(m).netY;
    return m[siraAlan];

  return l.sort((a,b) => {
    const x = anahtar(a), y = anahtar(b);
    if (typeof x === "string") return x.localeCompare(y, "tr") * siraYon;
    return (x - y) * siraYon;
  });
}

    "<div class=\"c-ust\"><span class=\"av kare\" style=\"width:38px;height:38px;font-size:14px\">" + m.bas + "</span>" +
      "<div><h2>" + m.ad + "</h2><div class=\"alt\">" + m.alan + " · " +

          "<span class=\"skor-yorum\">" + skorYorum(s) + "</span></div>" +
        "<div class=\"kirilim\">" + kirilim + "</div></section>" +

        "<div style=\"display:flex;align-items:flex-end;gap:6px;height:96px\">" + cubuklar + "</div></section>" +

        "<div class=\"hesap-satir\"><span class=\"ad\">Abonelik</span>" +
          "<span class=\"tut\">" + (m.ucret ? para(m.ucret) : "$0") + "</span></div>" +
        "<div class=\"hesap-satir\"><span class=\"ad\">Yapay zekâ</span>" +
          "<span class=\"aciklayici\">" + m.mail.toLocaleString("tr-TR") + " mail</span>" +
          "<span class=\"tut eksi\">−" + para2(m.ai) + "</span></div>" +
        "<div class=\"hesap-satir\"><span class=\"ad\">Altyapı payı</span>" +
          "<span class=\"aciklayici\">" + para(ALTYAPI) + " ÷ " + MUSTERILER.length + "</span>" +
          "<span class=\"tut eksi\">−" + para2(mh.altyapiPay) + "</span></div>" +

          (mh.netY !== null ? "  ·  %" + mh.netY : "") + "</span></div>" +

function talepHTML(){
  const bekleyen = TALEPLER.filter(t => t.durum === "yeni").length;

  const kurulan  = TALEPLER.filter(t => t.durum === "kuruldu").length;

  const gorunen  = talepSuzgec === "acik" ? acikLar : TALEPLER;
  const donusum  = TALEPLER.length ? Math.round(kurulan / TALEPLER.length * 100) : 0;

  const satirlar = gorunen.length ? gorunen.map(t => {
    const d = TALEP_DURUM[t.durum];

      encodeURIComponent("  · ") + NL + NL +

      encodeURIComponent("Enes");

      "kayıtları görür. Müşterinin tüm yazışmasını okuyabildiğin bir sistemde bunu " +
      "gizlemek, öğrenildiği gün şirketi bitirir.</p></div></div>" +

    "<div class=\"gun-suz\">" + suzgec.map(s =>
      "<button class=\"" + (gunlukSuz === s[0] ? "aktif" : "") + "\" data-gsuz=\"" + s[0] + "\">" +
      s[1] + (s[0] === "hepsi" ? "" : " · " + OLAYLAR.filter(o => o.tur === s[0]).length) +
      "</button>").join("") + "</div>" +

    "<div class=\"tablo-sar\">" + l.map(o =>
      "<div class=\"olay" + (o.vurgu ? " vurgu" : "") + "\">" +
        "<span class=\"vakit\">" + o.vakit + "</span>" +
        "<span class=\"tur t-" + o.tur + "\">" + OLAY_AD[o.tur] + "</span>" +
        "<span class=\"ic\">" + o.ic + "</span>" +
        "<span class=\"kim\">" + o.kim + "</span></div>").join("") + "</div>" +

    "<p class=\"dip\">Günlük 90 gün saklanır, sonra özetlenip arşive taşınır. " +
    "<b>Hesaba giriş kayıtları hiç silinmez.</b> KVKK açısından veri işleyen sıfatının " +
    "gereği bu; bir denetimde ilk istenecek şey de budur.</p></div>";
}

const PLANLAR = [
  {id:"baslangic", ad:"Başlangıç", ucret:99,  kutu:2,  kullanici:3,
   ozet:"Tek kutu, temel kategoriler, e-posta destek"},
  {id:"pro", ad:"Pro", ucret:249, kutu:5, kullanici:10,
   ozet:"Yönlendirme kuralları, PDF analizi, öncelikli destek"},
  {id:"kurumsal", ad:"Kurumsal", ucret:399, kutu:0, kullanici:0,
   ozet:"Sınırsız kutu ve kullanıcı, şube yönetimi, özel eğitim"}
];
let planSecim = null;

function planModalHTML(){
  const m = MUSTERILER.find(x => x.ad === planDegis);
  const mevcut = PLANLAR.find(x => x.id === m.plan) || {ad:"Deneme", ucret:0, id:"deneme"};
  const yeni = PLANLAR.find(x => x.id === (planSecim || m.plan)) || mevcut;
  const fark = yeni.ucret - mevcut.ucret;
  const kalan = 21;
  const orantili = Math.round(fark * kalan / 30);
  const mh = marjHesap(m);
  const yeniNet = yeni.ucret - m.ai - mh.altyapiPay - mh.destekBedel;

  const secenekler = PLANLAR.map(x =>
    "<button class=\"secenek" + (x.id === (planSecim || m.plan) ? " secili" : "") +
    "\" data-plansec=\"" + x.id + "\"><span class=\"kutucuk\"></span>" +
    "<span style=\"flex:1\"><b>" + x.ad + " · " + para(x.ucret) + "/ay</b>" +
    "<small>" + x.ozet + "</small></span>" +
    (x.id === mevcut.id ? "<span class=\"plan p-" + x.id + "\">mevcut</span>" : "") +
    "</button>").join("");

  return "<div class=\"modal-perde\" id=\"p-perde\"><div class=\"modal\" role=\"dialog\" " +
    "style=\"width:min(540px,100%);max-height:88vh;overflow-y:auto\">" +
    "<h2>" + m.ad + " · plan değiştir</h2>" +
    "<p>Şu an <b>" + mevcut.ad + "</b> planında, " + para(mevcut.ucret) + "/ay ödüyor.</p>" +

    secenekler +

    (fark !== 0
      ? "<div class=\"kutu-uyari\" style=\"background:" + (fark > 0 ? "var(--olm-yum)" : "var(--uyr-yum)") +
        ";color:" + (fark > 0 ? "var(--olumlu)" : "var(--uyari)") + ";margin-top:16px\">" +
        ikon(fark > 0 ? "grafik" : "geri",16) + "<span>Aylık gelir <b>" +
        (fark > 0 ? "+" : "") + para(fark) + "</b> değişecek. Bu döngüde " + kalan +
        " gün kaldığı için ilk faturaya orantılı <b>" + (orantili > 0 ? "+" : "") +
        para(orantili) + "</b> yansıyacak, sonraki aydan itibaren tam tutar.</span></div>"
      : "<div class=\"kutu-uyari\" style=\"margin-top:16px\">" + ikon("bilgi",16) + "" +
        "<span>Farklı bir plan seçilmedi.</span></div>") +

    "<div style=\"margin-top:16px\">" +
      "<div class=\"mal-satir\"><span class=\"ad\">Yeni abonelik</span>" +
        "<span class=\"tut\">" + para(yeni.ucret) + "</span></div>" +
      "<div class=\"mal-satir\"><span class=\"ad\">Yapay zekâ + altyapı + destek</span>" +
        "<span class=\"ek\">değişmiyor</span>" +
        "<span class=\"tut eksi\">−" + para2(m.ai + mh.altyapiPay + mh.destekBedel) + "</span></div>" +
      "<div class=\"mal-satir top\"><span class=\"ad\">Yeni net marj</span>" +
        "<span class=\"tut" + (yeniNet < 0 ? " eksi" : "") + "\">" + para2(yeniNet) +
        (yeni.ucret ? "  ·  %" + Math.round(yeniNet / yeni.ucret * 100) : "") + "</span></div>" +
    "</div>" +

    (m.destek >= 2 && yeni.ucret <= 99
      ? "<p class=\"dip\" style=\"margin-top:12px\">Bu müşteri ayda " +
        m.destek.toLocaleString("tr-TR",{minimumFractionDigits:1}) + " saat destek istiyor. " +
        "Başlangıç planında net marj çok düşük kalıyor — <b>Pro'ya çıkarmak</b> ya da " +
        "destek kapsamını daraltmak gerekiyor.</p>"
      : "") +

    "<div class=\"eylem\" style=\"margin-top:18px\">" +
      "<button class=\"dugme\" id=\"p-iptal\">Vazgeç</button>" +
      "<button class=\"dugme ana\" id=\"p-onay\"" + (fark === 0 ? " disabled" : "") +
      ">Planı değiştir</button></div>" +
    "</div></div>";
}

let zamanlayici;
function bildir(metin){
  const b = $("#bildirim");
  b.textContent = metin; b.classList.add("gorunur");
  clearTimeout(zamanlayici);
  zamanlayici = setTimeout(() => b.classList.remove("gorunur"), 2600);
}

function bagla(){
  document.querySelectorAll("[data-sirala]").forEach(b => {
    b.onclick = () => {
      const a = b.dataset.sirala;
      if (siraAlan === a) siraYon = -siraYon; else { siraAlan = a; siraYon = a === "ad" ? 1 : -1; }
      ciz();
    };
  });
  const ar = $("#arama");
  if (ar){
    ar.oninput = e => {
      aramaMetni = e.target.value;
      const k = e.target.selectionStart;
      ciz();
      const y = $("#arama");
      if (y){ y.focus(); y.setSelectionRange(k, k); }
    };
  }
  document.querySelectorAll("[data-mus]").forEach(tr => {
    tr.onclick = () => { secilenMus = tr.dataset.mus; ciz(); };
  });
  document.querySelectorAll("[data-suz]").forEach(b => {
    b.onclick = () => { talepSuzgec = b.dataset.suz; ciz(); };
  });
  const talepGec = (sec, yeni, mesaj) => {
    document.querySelectorAll("[data-" + sec + "]").forEach(b => {
      b.addEventListener("click", () => {
        const t = TALEPLER.find(x => x.id === +b.dataset[sec]);
        if (!t) return;
        t.durum = yeni;
        bildir(t.firma + " · " + mesaj);
        /* mailto bağlantısı kendi işini yapsın, çizim bir tık sonra */
        setTimeout(ciz, 0);
      });
    });
  };
  talepGec("yazildi", "yazildi", "saat önerisi yazıldı");
  talepGec("kuruldu", "kuruldu", "görüşme takvime girdi");
  talepGec("kapat",   "kapandi", "talep kapatıldı");
  talepGec("geriac",  "yeni",    "talep yeniden açıldı");

  document.querySelectorAll("[data-is]").forEach(b => {
    b.onclick = () => {
      const t = TRIYAJ.find(x => x.id === +b.dataset.is);
      t.bitti = true;
      bildir(t.eylem + " · iş tamamlandı olarak işaretlendi");
      ciz();
    };
  });
  document.querySelectorAll("[data-ertele]").forEach(b => {
    b.onclick = () => {
      const t = TRIYAJ.find(x => x.id === +b.dataset.ertele);
      TRIYAJ = TRIYAJ.filter(x => x.id !== t.id).concat(t);
      bildir(t.firma + " · yarına ertelendi");
      ciz();
    };
  });
  document.querySelectorAll("[data-gir]").forEach(b => {
    b.onclick = () => { girilecek = b.dataset.gir; ciz(); };
  });
  document.querySelectorAll("[data-is-yeni]").forEach(b => {
    b.onclick = () => bildir(b.dataset.isYeni + " · iş kuyruğuna eklendi");
  });
  document.querySelectorAll("[data-gsuz]").forEach(b => {
    b.onclick = () => { gunlukSuz = b.dataset.gsuz; ciz(); };
  });
  document.querySelectorAll("[data-yeniden]").forEach(b => {
    b.onclick = () => bildir(b.dataset.yeniden + " · yeniden bağlanma denemesi kuyruğa alındı");
  });
  document.querySelectorAll("[data-dogrula]").forEach(b => {
    b.onclick = () => bildir(b.dataset.dogrula + " · bağlantı doğrulandı");
  });
  document.querySelectorAll("[data-plan]").forEach(b => {
    b.onclick = () => { planDegis = b.dataset.plan; planSecim = null; ciz(); };
  });
  document.querySelectorAll("[data-plansec]").forEach(b => {
    b.onclick = () => { planSecim = b.dataset.plansec; ciz(); };
  });
  if (planDegis){
    $("#p-iptal").onclick = () => { planDegis = null; planSecim = null; ciz(); };
    $("#p-perde").onclick = e => { if (e.target.id === "p-perde"){ planDegis = null; planSecim = null; ciz(); } };
    const po = $("#p-onay");
    if (po) po.onclick = () => {
      const m = MUSTERILER.find(x => x.ad === planDegis);
      if (planSecim){ m.plan = planSecim; m.ucret = PLANLAR.find(x => x.id === planSecim).ucret; }
      bildir(planDegis + " planı güncellendi");
      planDegis = null; planSecim = null; ciz();
    };
  }

  const kapat = $("#c-kapat");
  if (kapat) kapat.onclick = () => { secilenMus = null; ciz(); };
  const perde = $("#perde");
  if (perde) perde.onclick = () => { secilenMus = null; ciz(); };

  const nk = $("#not-kaydet");
  if (nk){
    const kaydet = () => {
      const g = $("#not-girdi");
      if (!g.value.trim()) return;
      const m = MUSTERILER.find(x => x.alan === secilenMus);
      m.notlar.unshift({kim:"Enes", vakit:"az önce", metin:g.value.trim()});
      bildir("Not eklendi");
      ciz();
    };
    nk.onclick = kaydet;
    $("#not-girdi").onkeydown = e => { if (e.key === "Enter") kaydet(); };
  }

  if (girilecek){
    $("#g-iptal").onclick = () => { girilecek = null; ciz(); };
    $("#m-perde").onclick = e => { if (e.target.id === "m-perde"){ girilecek = null; ciz(); } };
    $("#g-onay").onclick = () => {
      bildir(girilecek + " paneline giriliyor · kayıt alındı");
      girilecek = null; ciz();
    };
  }
}

function opAmblem(){
  const a = $("#amblem");
  if (a && !a.childElementCount) a.innerHTML = ikon("anahtar", 18);
  const c = $("#op-cikis");
  if (c && !c.childElementCount) c.innerHTML = ikon("cikis", 16);
}

function ciz(){
  opAmblem();
  if (!opOturum){
    document.querySelector(".uygulama").style.display = "none";
    $("#kaplama").innerHTML = opGirisHTML();
    $("#op-gir").onclick = () => { opOturum = true; ciz(); };
    return;
  }
  document.querySelector(".uygulama").style.display = "";
  navCiz();
  const oc = $("#op-cikis");
  if (oc) oc.onclick = () => { opOturum = false; sayfa = "bakis"; ciz(); };
  if (sayfa === "bakis") $("#sahne").innerHTML = bakisHTML();
  else if (sayfa === "talep") $("#sahne").innerHTML = talepHTML();
  else if (sayfa === "mus") $("#sahne").innerHTML = musHTML();
  else if (sayfa === "sistem") $("#sahne").innerHTML = sistemHTML();
  else if (sayfa === "saglik") $("#sahne").innerHTML = saglikHTML();
  else if (sayfa === "maliyet") $("#sahne").innerHTML = maliyetHTML();
  else if (sayfa === "abone") $("#sahne").innerHTML = aboneHTML();
  else $("#sahne").innerHTML = gunlukHTML();

  const m = MUSTERILER.find(x => x.alan === secilenMus);
  $("#kaplama").innerHTML = (m ? cekmeceHTML(m) : "") +
    (girilecek ? girisModalHTML() : "") + (planDegis ? planModalHTML() : "");
  bagla();
}
ciz();
</script>
